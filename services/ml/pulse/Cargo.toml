
[package]
name = "bsopt_pulse"
version = "0.1.0"
edition = "2021"

[lib]
name = "bsopt_pulse"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.0", features = ["extension-module"] }
socket2 = "0.5.5"
libc = "0.2.153"
memmap2 = "0.9.4"
structlog = { version = "0.1.0", optional = true } # We'll log via PyO3
