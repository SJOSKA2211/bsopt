syntax = "proto3";

package Manifold.common;

option go_package = "github.com/Manifold/common";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message Empty {}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  bool healthy = 1;
  string status = 2;
  map<string, string> metadata = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
  string sort_by = 3;
  bool descending = 4;
}

message PaginationResponse {
  int32 total_items = 1;
  int32 total_pages = 2;
  int32 current_page = 3;
  int32 page_size = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

message TimestampRange {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
  string details = 3;
  repeated ErrorField errors = 4;
  google.protobuf.Timestamp timestamp = 5;
  string request_id = 6;
}

message ErrorField {
  string field = 1;
  string message = 2;
  string code = 3;
}

message Metadata {
  map<string, string> tags = 1;
  map<string, int64> counters = 2;
  map<string, double> gauges = 3;
}

message BatchRequest {
  repeated string ids = 1;
  map<string, string> parameters = 2;
}

message BatchResponse {
  repeated google.protobuf.Value results = 1;
  repeated ErrorResponse errors = 2;
  int32 success_count = 3;
  int32 failure_count = 4;
}

message VersionInfo {
  string version = 1;
  string build_hash = 2;
  string build_date = 3;
  string go_version = 4;
  string os = 5;
  string arch = 6;
}

message RateLimitInfo {
  int64 limit = 1;
  int64 remaining = 2;
  int64 reset_time = 3;
  string tier = 4;
}

message QuotaInfo {
  string resource = 1;
  int64 used = 2;
  int64 limit = 3;
  double utilization_percent = 4;
}