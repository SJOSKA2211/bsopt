[package]
name = "bsopt_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "bsopt_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py312"] }
numpy = "0.21"
ndarray = { version = "0.15", features = ["serde"] }
rayon = "1.8"
statrs = "0.18"
sha3 = "0.10.8"
hex = "0.4.3"
argmin = "0.9.0"
argmin-math = { version = "0.3.0", features = ["ndarray_latest-nolinalg"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
num-complex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
