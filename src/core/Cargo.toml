[package]
name = "bsopt_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "bsopt_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py312"] }
numpy = "0.21"
ndarray = "0.15"
rayon = "1.8"
statrs = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
