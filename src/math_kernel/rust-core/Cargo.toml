[package]
name = "Manifold-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "Manifold_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
numpy = "0.21.0"
ndarray = "0.15"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
statrs = "0.16"
rand = "0.8"
rand_distr = "0.4"
anyhow = "1.0"
num-complex = "0.4"
