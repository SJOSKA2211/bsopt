[package]
name = "manifold-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "manifold_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.3", features = ["extension-module"] }
numpy = "0.23.0"
ndarray = "0.15"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
rand = "0.8"
rand_distr = "0.4"
anyhow = "1.0"
num-complex = "0.4"
prometheus = "0.13"
lazy_static = "1.4"
tokio = { version = "1.35", features = ["full"] }
flatbuffers = "24.3.25"
socket2 = { version = "0.5", features = ["all"] }
crossbeam-channel = "0.5"
itertools = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
