[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "Manifold_core"
version = "0.1.0"
description = "High-performance Rust math core for BSOPT"
authors = [{ name = "Antigravity Agent" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.21.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "Manifold_core"
