[package]
name = "bsopt-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "bsopt_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
memmap2 = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10.0"
numpy = "0.21.0"
ndk = { version = "0.8", optional = true } # For mobile if needed, but not now

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
