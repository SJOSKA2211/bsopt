services:
  api:
    image: bsopt-api-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.api-dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    networks:
      - bsopt-network-dev
    env_file:
      - .env
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - postgres
      - redis

  auth-service:
    image: bsopt-auth-service-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.auth-service-dev
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://localhost:3001
    volumes:
      - ./src/auth-service:/app
      - /app/node_modules
    networks:
      - bsopt-network-dev
    env_file:
      - .env
    depends_on:
      - postgres

  app-gateway:
    image: bsopt-app-gateway-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.app-gateway
      target: development
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - LOG_LEVEL=debug
      - API_URL=http://api:8000/graphql
      - PRICING_URL=http://neural-pricing:8000/graphql
    volumes:
      - ./src/gateway:/app
      - /app/node_modules
    networks:
      - bsopt-network-dev
    depends_on:
      api:
        condition: service_healthy
      neural-pricing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: bsopt-frontend-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    networks:
      - bsopt-network-dev
    depends_on:
      api:
        condition: service_healthy
      auth-service:
        condition: service_started
      app-gateway:
        condition: service_healthy

  neural-pricing:
    image: bsopt-neural-pricing-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.neural-pricing-dev
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    networks:
      - bsopt-network-dev
    env_file:
      - .env
    command: ["uvicorn", "src.pricing.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - postgres
      - redis

  scraper:
    image: bsopt-scraper-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper-dev
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    networks:
      - bsopt-network-dev
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  worker-ml:
    image: bsopt-worker-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-dev
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env
    networks:
      - bsopt-network-dev
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: timescale/timescaledb:latest-pg16
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf' -c 'hba_file=/etc/postgresql/pg_hba.conf'
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: bsopt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - bsopt-network-dev
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bsopt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-bsopt_redis_secret}
    ports:
      - "6379:6379"
    networks:
      - bsopt-network-dev
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bsopt_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_ERLANG_COOKIE=secret_cookie_for_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    networks:
      - bsopt-network-dev
    deploy:
      resources:
        limits:
          memory: 512M

  test-runner:
    image: bsopt-ci-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.ci
    environment:
      - ENVIRONMENT=dev
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/bsopt
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev_secret_key
    networks:
      - bsopt-network-dev
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  # === [Specialized] ML Compute Cluster (Containerized Dev) ===
  ray-head:
    image: rayproject/ray:latest-py312-cpu
    shm_size: '2gb'
    ports:
      - "8265:8265" # Dashboard
      - "10001:10001" # Ray Client
    networks:
      - bsopt-network-dev
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/bsopt
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev_secret_key
      - INSIDE_DOCKER=1
    volumes:
      - ./:/app
    working_dir: /app
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --include-dashboard=true --block

  rl-training-worker:
    image: rayproject/ray:latest-py312-cpu
    shm_size: '2gb'
    depends_on:
      - ray-head
    environment:
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/bsopt
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev_secret_key
      - INSIDE_DOCKER=1
    networks:
      - bsopt-network-dev
    volumes:
      - ./:/app
    working_dir: /app
    command: ray start --address=ray-head:6379 --block

  frontend-test:
    image: bsopt-frontend-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: development
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    networks:
      - bsopt-network-dev
    command: npm run test -- --run

  e2e-test:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    working_dir: /app/src/frontend
    volumes:
      - .:/app
    environment:
      - PLAYWRIGHT_TEST_BASE_URL=http://frontend:5173
    networks:
      - bsopt-network-dev
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_started
      api:
        condition: service_healthy
      app-gateway:
        condition: service_healthy
    command: npx playwright test

networks:
  bsopt-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
  rabbitmq_data_dev:
