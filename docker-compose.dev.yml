services:
  api:
    image: bsopt-api-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.api-dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src
    networks:
      - bsopt-network-dev
    depends_on:
      - postgres
      - redis

  auth-service:
    image: bsopt-auth-service-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.auth-service-dev
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://localhost:3001
    volumes:
      - ./src/auth-service:/app
      - /app/node_modules
    networks:
      - bsopt-network-dev
    depends_on:
      - postgres

  frontend:
    image: bsopt-frontend-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    networks:
      - bsopt-network-dev
    depends_on:
      - api
      - auth-service

  neural-pricing:
    image: bsopt-neural-pricing-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.neural-pricing-dev
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src
    networks:
      - bsopt-network-dev

  scraper:
    image: bsopt-scraper-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper-dev
    volumes:
      - ./src:/app/src
    networks:
      - bsopt-network-dev
    depends_on:
      - postgres
      - redis

  worker-ml:
    image: bsopt-worker-dev
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-dev
    volumes:
      - ./src:/app/src
    networks:
      - bsopt-network-dev
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: timescale/timescaledb:latest-pg16
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: bsopt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    networks:
      - bsopt-network-dev
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - bsopt-network-dev
    deploy:
      resources:
        limits:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_ERLANG_COOKIE=secret_cookie_for_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    networks:
      - bsopt-network-dev
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  bsopt-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
  rabbitmq_data_dev:
