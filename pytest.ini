[pytest]
asyncio_mode = auto
testpaths = tests/unit tests/integration
python_files = test_*.py
addopts = -v --tb=short
env =
    NUMBA_DISABLE_JIT=1
    BSOPT_ALLOW_WEAK_SECRETS=true
    ENVIRONMENT=test
    TESTING=true
markers =
    unit: small, isolated unit tests
    integration: tests that require external dependencies like DB/Redis