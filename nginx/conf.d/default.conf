# Default Nginx Configuration for BS-OPT

# This file configures Nginx as a reverse proxy for the API and Frontend services.

# Default server for handling general requests and health checks.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _; # Catch-all server

    # Health check endpoint for Nginx itself (optional)
    location /nginx-health {
        return 200 "nginx is running
";
        add_header Content-Type text/plain;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://api_service:8000/; # Proxy to the API service container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # For WebSocket support if needed by API
    }

    # Proxy Frontend requests
    # Assuming the frontend serves static assets on port 80 after build
    # The healthcheck in docker-compose pointed to 5175, which is unusual for static serving.
    # We will proxy to port 80 as per standard Nginx practice for static files,
    # and assume the healthcheck will be adjusted or Nginx will be configured for both.
    location / {
        proxy_pass http://frontend:80/; # Proxy to the Frontend service container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# Note: For serving static frontend assets directly via Nginx without a proxy,
# you would use 'root /usr/share/nginx/html;' and 'try_files $uri /index.html;'
# inside a server block listening on port 80, rather than proxy_pass.
# Since the frontend Dockerfile builds static assets and copies them to Nginx's html dir,
# we will configure Nginx to serve these static files directly.

server {
    listen 80; # Default server for static frontend assets
    server_name _; # Catch-all server for frontend

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html; # For single-page applications (SPA)
    }

    # Health check for frontend (adjust if the frontend build doesn't serve on /health)
    # This assumes the frontend static files are served directly by Nginx.
    location /health {
        return 200 'Frontend health check OK
';
        add_header Content-Type text/plain;
    }

    # Add API proxying to this server block as well if Nginx is the single entry point
    # or keep it separate if desired. For simplicity, let's keep API proxying in the first block.
    # If Nginx is the single entry point, then API proxying should be in this block.
}
