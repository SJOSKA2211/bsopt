global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Core API & Pricing Services ---
  - job_name: 'bsopt-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
    metrics_path: /metrics

  - job_name: 'bsopt-neural-pricing'
    static_configs:
      - targets: ['neural-pricing:8000']
        labels:
          service: 'neural-pricing'
    metrics_path: /metrics

  # --- Data Ingestion ---
  - job_name: 'bsopt-scraper'
    static_configs:
      - targets: ['scraper:8000']
        labels:
          service: 'scraper'
    metrics_path: /metrics

  # --- Ray ML Cluster ---
  - job_name: 'ray-cluster'
    static_configs:
      - targets: ['ray-head:8080']
        labels:
          component: 'ray-head'

  # --- Infrastructure ---
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # --- Pushgateway (for batch jobs) ---
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # --- Prometheus self-monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
