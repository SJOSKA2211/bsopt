global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'bsopt-services'
    static_configs:
      - targets: ['api:8000', 'ml-inference:8000', 'neural-pricing:8000', 'mlops-worker:8000']

  - job_name: 'ray'
    static_configs:
      - targets: ['ray-head:8080', 'rl-training-worker:8080']

  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
