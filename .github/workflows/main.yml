name: BS-Opt CI/CD/CT Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Continuous Training trigger: Daily at 2 AM
    - cron: '0 2 * * *'

jobs:
  test-and-lint:
    name: Run Tests and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          
      - name: Linting
        run: |
          make lint
          make format
          
      - name: Run Tests
        run: |
          make test-all

  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bsopt-api:latest
          
      - name: Build & Push Scraper
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.scraper-lite
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bsopt-scraper:latest

  continuous-training:
    name: CT Pipeline (MLflow Retraining)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Trigger Retraining
        run: |
          echo "Checking new market data volume..."
          # In a real environment, this triggers a Celery beat task or webhook 
          # to check the database threshold. For now, we simulate the hook.
          curl -X POST https://api.bsopt.com/api/v1/ml/retrain \
               -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
               -H "Content-Type: application/json" \
               -d '{"force": false, "threshold": 50000}'
