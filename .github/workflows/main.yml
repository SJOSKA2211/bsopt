name: BS-Opt CI/CD/CT Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Continuous Training trigger: Daily at 2 AM
    - cron: '0 2 * * *'

jobs:
  test-and-lint:
    name: Run Tests and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt
          
      - name: Linting
        run: |
          make lint
          make format

      - name: Math Kernel Smoke Test
        run: |
          python -c "from src.shared.math_utils import calculate_greeks, calculate_price; import numpy as np; s = np.array([100.0, 110.0, 90.0]); k = np.array([100.0, 100.0, 100.0]); t = np.array([0.25, 0.5, 1.0]); sigma = np.array([0.2, 0.25, 0.3]); r = np.array([0.05, 0.05, 0.05]); q = np.array([0.01, 0.01, 0.01]); is_call = np.array([True, True, False]); delta, gamma, theta, vega, rho = calculate_greeks(s, k, t, sigma, r, q, is_call); assert delta.shape == s.shape, 'Greeks shape mismatch'; assert np.all(np.isfinite(delta)), 'Non-finite Greeks detected'; prices = calculate_price(s, k, t, sigma, r, q, is_call); assert np.all(prices > 0), 'Negative prices detected'; print('Math kernel validation PASSED')"
          
      - name: SAST Scanning (Bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll -x tests/ -c pyproject.toml
          
      - name: Run Tests
        run: |
          make test-all

      - name: Docker Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bsopt-api:latest'
          format: 'table'
          exit-code: '0' # Don't fail build yet, just report
          severity: 'CRITICAL,HIGH'

  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api-prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bsopt-api:latest,${{ secrets.DOCKER_USERNAME }}/bsopt-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build & Push Scraper
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.scraper-prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bsopt-scraper:latest,${{ secrets.DOCKER_USERNAME }}/bsopt-scraper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker-prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bsopt-worker:latest,${{ secrets.DOCKER_USERNAME }}/bsopt-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Neural Pricing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.neural-pricing-prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bsopt-neural-pricing:latest,${{ secrets.DOCKER_USERNAME }}/bsopt-neural-pricing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  continuous-training:
    name: CT Pipeline (MLflow Retraining)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Check Data Volume & Trigger Retraining
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          python -c "
import os, sys
try:
    from sqlalchemy import create_engine, text
    engine = create_engine(os.environ['DATABASE_URL'])
    with engine.connect() as conn:
        count = conn.execute(text('SELECT COUNT(*) FROM market_ticks')).scalar()
        print(f'Market ticks count: {count}')
        if count < 50000:
            print('Insufficient data for retraining, skipping.')
            sys.exit(0)
except Exception as e:
    print(f'DB check failed: {e}')
    sys.exit(0)
"
          # Trigger retraining via internal API or direct pipeline execution
          python -m src.ml.cross_sectional_pipeline --epochs 10 --study_name ct_daily || true
