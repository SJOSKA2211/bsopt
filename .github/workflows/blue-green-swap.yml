name: Blue-Green Traffic Swap

on:
  workflow_dispatch:
    inputs:
      target_color:
        description: 'New active color (blue/green)'
        required: true
        default: 'green'

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
      - name: Apply Swap
        run: |
          terraform apply -auto-approve -var="active_environment=${{ github.event.inputs.target_color }}"
        working-directory: infrastructure/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          
      - name: Verify Swap
        run: |
          echo "Traffic successfully swapped to ${{ github.event.inputs.target_color }}"
