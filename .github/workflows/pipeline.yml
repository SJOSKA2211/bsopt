name: EquaFlow Hardened Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run Ruff (Linting)
        run: |
          pip install ruff
          ruff check .

      - name: Run Bandit (Security Linting)
        run: |
          pip install bandit
          bandit -r src/

      - name: Run Trivy (Container Scan Placeholder)
        run: |
          # In a real environment, we'd scan the built image
          echo "Scanning container images..."

  test:
    name: Automated Testing
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .[dev,api,auth,ml,distributed]

      - name: Run Unit Tests
        run: pytest tests/unit

      - name: Run E2E Tests (Playwright)
        run: |
          pip install playwright
          playwright install --with-deps chromium
          pytest tests/e2e

  build:
    name: Build & Push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Image
        run: |
          echo "Building and tagging docker image..."
          # docker build -t equaflow:latest .
