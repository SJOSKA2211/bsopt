name: BS-Opt MLOps Continuous Training (Dockerized)

on:
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

jobs:
  containerized-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-ml-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-ml-
      - name: Build ML Cluster Images
        run: |
          docker compose --profile ml build ray-head rl-training-worker api postgres redis
      - name: Run Training in Ray Cluster
        run: |
          # Start the ML infrastructure and run the orchestrator
          docker compose --profile ml up -d ray-head rl-training-worker postgres redis
          docker compose --profile ml run --rm api python src/ml/pipelines/orchestrator.py --model-type xgboost --promote-to-production
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      - name: Teardown ML Cluster
        if: always()
        run: docker compose --profile ml down -v
