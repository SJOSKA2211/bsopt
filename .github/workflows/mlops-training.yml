name: BS-Opt MLOps Continuous Training (Dockerized)

on:
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

jobs:
  docker-ml-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ML Cluster Images
        run: |
          docker compose --profile ml build ray-head rl-training-worker api

  containerized-training:
    runs-on: ubuntu-latest
    needs: docker-ml-setup
    steps:
      - uses: actions/checkout@v4
      - name: Run Training in Ray Cluster
        run: |
          # Start the ML infrastructure and run the orchestrator
          docker compose --profile ml up -d ray-head rl-training-worker postgres redis
          docker compose --profile ml run --rm api python src/ml/pipelines/orchestrator.py --model-type xgboost --promote-to-production
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

  cleanup:
    runs-on: ubuntu-latest
    needs: containerized-training
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Teardown ML Cluster
        run: docker compose --profile ml down -v
