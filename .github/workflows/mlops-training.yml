name: BS-Opt MLOps Continuous Training (Dockerized)

on:
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

jobs:
  containerized-training:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: bsopt
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ci_test_password
      DATABASE_URL: postgresql://admin:ci_test_password@postgres:5432/bsopt
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-ml-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-ml-
      - name: Build ML Cluster Images
        run: |
          docker compose --profile ml build ray-head rl-training-worker api postgres redis
      - name: Run Training in Ray Cluster
        run: |
          # Start the ML infrastructure and run the orchestrator
          docker compose --profile ml up -d ray-head rl-training-worker postgres redis
          docker compose --profile ml run --rm api python -m src.ml.pipelines.orchestrator --model-type xgboost --promote-to-production
      - name: Teardown ML Cluster
        if: always()
        run: docker compose --profile ml down -v
