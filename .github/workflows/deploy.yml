name: "EquaFlow CI/CD & DevSecOps Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-and-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Lint with Ruff
        run: ruff check src/

      - name: SAST with Bandit
        run: bandit -r src/ -ll -ii -c pyproject.toml

  build-and-test:
    needs: security-and-linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Bootstrap and run E2E
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh
        env:
          POSTGRES_PASSWORD: "test-db-password"
          REDIS_PASSWORD: "test-redis-password"

  container-security:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build local container for scanning
        run: docker build -t equaflow-api:local -f infrastructure/docker/Dockerfile.api --target production .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'equaflow-api:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-blue-green:
    needs: container-security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via ArgoCD / Helm (Placeholder)
        run: |
          echo "Triggering Blue-Green deployment on Kubernetes..."
          echo "Updating Helm charts with new image tag: ${{ github.sha }}"
          # Add kubectl / helm commands here

  continuous-training-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check TimescaleDB Volume Threshold (CT Trigger)
        run: |
          echo "Simulating check for volume thresholds in TimescaleDB..."
          # If volume > threshold, trigger MLflow / Ray training job
          echo "CT Trigger verified."
