name: BS-Opt Application Pipeline (Master Orchestration)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: bsopt
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ci_test_password
      DATABASE_URL: postgresql://admin:ci_test_password@postgres:5432/bsopt
      DATABASE_URL_TEST: postgresql://admin:ci_test_password@postgres:5432/bsopt_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ci_test_jwt_secret
      BETTER_AUTH_SECRET: ci_test_better_auth_secret
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Enable BuildKit caching
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "COMPOSE_DOCKER_CLI_BUILD=1" >> $GITHUB_ENV
        
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
          
      - name: Setup Environment
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=bsopt
          POSTGRES_USER=admin
          POSTGRES_PASSWORD=ci_test_password
          DATABASE_URL=postgresql://admin:ci_test_password@postgres:5432/bsopt
          DATABASE_URL_TEST=postgresql://admin:ci_test_password@postgres:5432/bsopt_test
          REDIS_URL=redis://redis:6379/0
          JWT_SECRET=ci_test_jwt_secret
          BETTER_AUTH_SECRET=ci_test_better_auth_secret
          EOF
          
      - name: Build Images Sequentially
        run: |
          echo "=== Building API image ==="
          docker compose build api
          
          echo "=== Building App Gateway image ==="
          docker compose build app-gateway
          
          echo "=== Building Auth Service image ==="
          docker compose build auth-service
          
          echo "=== Building Frontend image ==="
          docker compose build frontend
          
          echo "=== Pruning dangling images to reclaim space ==="
          docker image prune -f
          docker builder prune -f --filter "until=5m" || true
          
          echo "=== Building Worker image ==="
          docker compose build worker
          
          echo "=== Building Scraper image ==="
          docker compose build scraper
          
          echo "=== Building Neural Pricing image ==="
          docker compose build neural-pricing
          
          echo "=== Pruning again ==="
          docker image prune -f
          docker builder prune -f --filter "until=5m" || true
          
          echo "=== Building Portfolio image ==="
          docker compose build portfolio
          
          echo "=== Building test-runner image ==="
          docker compose build test-runner
          
          echo "=== All images built ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Lint, Format, and Security Scan via Makefile
        run: |
          make lint
          make format
          make security-scan

      - name: Start Dependencies
        run: docker compose up -d postgres redis rabbitmq

      - name: Run Integration Tests via Makefile
        run: make test-all

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Orchestrator
        run: ./deploy.sh --prod
