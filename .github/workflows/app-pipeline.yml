name: BS-Opt Application Pipeline (Master Orchestration)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
            
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
          
      - name: Setup Environment
        run: |
          cp .env.example .env
          cp .env.test .env || echo "No .env.test found, continuing"
          
      - name: Build Images via Makefile
        run: make build
        
      - name: Start Missing Dependencies
        run: docker compose up -d postgres redis rabbitmq

      - name: Lint, Format, and Security Scan via Makefile
        run: |
          make lint
          make format
          make security-scan
          
      - name: Run Integration Tests via Makefile
        run: make test-all

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Orchestrator
        run: ./deploy.sh --prod
