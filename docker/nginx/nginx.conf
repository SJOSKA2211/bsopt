user nginx;
worker_processes auto;
worker_rlimit_nofile 200000;
events {
    use epoll;
    multi_accept on;
    worker_connections 40000;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 30;
    keepalive_requests 500000;

    client_body_buffer_size 128k;
    client_max_body_size 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' ws: wss:;";

    # Upstreams
    upstream gateway_backend {
        server app-gateway:4000;
        keepalive 256;
    }
    upstream auth_backend {
        server auth-service:3001;
        keepalive 128;
    }
    upstream api_backend {
        server api:8000;
        keepalive 512;
    }
    upstream portfolio_backend {
        server portfolio:8000;
        keepalive 64;
    }

    server {
        listen 80;

        # Proxy Health Check
        location /health {
            access_log off;
            return 200 'proxy_is_operational';
        }

        # Auth Service
        location /auth/ {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # App Gateway (Microservices)
        location /api/ {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # WebSocket & Long-lived connections
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Portfolio Service
        location /portfolio/ {
            proxy_pass http://portfolio_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Static Frontend / API Fallback
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
