# ----------------------------------------
# PostgreSQL Configuration (God Mode Optimized)
# Target: 2GB RAM Container
# Postgres Version: 16 + TimescaleDB 2.17+
# ----------------------------------------

# --- Connectivity ---
listen_addresses = '*'
max_connections = 128
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = 5min
lock_timeout = 30s
statement_timeout = 10min

# --- Logging & Security ---
log_connections = on
log_disconnections = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_error_verbosity = default

# --- Memory Settings ---
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 32MB
maintenance_work_mem = 256MB
temp_buffers = 32MB
huge_pages = try # requires host configuration for best performance

# --- I/O & Write Optimization ---
random_page_cost = 1.1
effective_io_concurrency = 200
wal_level = replica
wal_buffers = 16MB
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB
synchronous_commit = on

# --- Worker & Parallelism ---
max_worker_processes = 12
max_parallel_workers_per_gather = 2
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
timescaledb.max_background_workers = 8

# --- PG 16 Specifics ---
vacuum_buffer_usage_limit = 256MB
default_statistics_target = 100
jit = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# --- Autovacuum Tuning ---
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.01
autovacuum_analyze_scale_factor = 0.005

# --- Extensions ---
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.track_planning = on
