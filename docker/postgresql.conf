# ----------------------------------------
# PostgreSQL Configuration (The Weaponizer - God Mode Optimized)
# Target: 4GB RAM Container
# Postgres Version: 16 + TimescaleDB 2.17+
# ----------------------------------------

# --- Connectivity ---
listen_addresses = '*'
max_connections = 100
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = 5min
lock_timeout = 30s
statement_timeout = 10min

# --- Logging & Security ---
log_connections = on
log_disconnections = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_error_verbosity = default
track_io_timing = on
track_functions = all
track_activity_query_size = 2048

# --- Memory Settings (Optimized for 4GB) ---
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 32MB             # Increased for complex BS-OPT joins
maintenance_work_mem = 256MB
temp_buffers = 64MB
huge_pages = try

# --- I/O & Write Optimization ---
random_page_cost = 1.1
effective_io_concurrency = 200
wal_level = replica
wal_buffers = 32MB
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB
synchronous_commit = off    # ⚡ Async commit for HFT-like throughput (Solenya Choice)

# --- Worker & Parallelism ---
max_worker_processes = 12
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
timescaledb.max_background_workers = 8

# --- PG 16 Specifics (The Weaponizer) ---
vacuum_buffer_usage_limit = 512MB
logical_decoding_work_mem = 64MB
default_statistics_target = 100
jit = on
jit_above_cost = 100000      # Only JIT heavy queries
jit_inline_above_cost = 500000
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# --- Autovacuum Tuning (Aggressive) ---
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.01
autovacuum_analyze_scale_factor = 0.005

# --- Extensions ---
shared_preload_libraries = 'timescaledb,pg_stat_statements,pg_prewarm,auto_explain'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.track_planning = on

# --- auto_explain configuration ---
auto_explain.log_min_duration = '500ms'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_wal = on
auto_explain.log_timing = on
auto_explain.log_triggers = on
auto_explain.log_verbose = on
auto_explain.log_nested_statements = on
auto_explain.sample_rate = 1

# --- TimescaleDB Specifics ---
timescaledb.enable_chunk_skipping = on
