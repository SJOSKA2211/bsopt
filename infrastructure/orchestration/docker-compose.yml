name: bsopt

services:
  
  base:
    image: equaflow-base:latest
    pull_policy: build
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.base

  # === Database Service ===
  postgres:
    image: docker.io/timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command: >
      sh -c "
      cp /etc/postgresql/postgres.key.host /tmp/postgres.key &&
      chown 70:70 /tmp/postgres.key &&
      chmod 600 /tmp/postgres.key &&
      exec docker-entrypoint.sh postgres 
      -c 'config_file=/etc/postgresql/postgresql.conf' 
      -c 'hba_file=/etc/postgresql/pg_hba.conf' 
      -c 'ident_file=/etc/postgresql/pg_ident.conf' 
      -c 'ssl_key_file=/tmp/postgres.key'
      "
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bsopt}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5434:5432"
    shm_size: '1gb'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infrastructure/init-scripts/init-scripts:/docker-entrypoint-initdb.d:ro
      - ../../src/shared/migrations:/migrations:ro
      - ../configs/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../configs/pg_hba.conf:/etc/postgresql/pg_hba.conf:rw
      - ../../.pki/postgres.crt:/etc/postgresql/postgres.crt:ro
      - ../../.pki/postgres.key:/etc/postgresql/postgres.key.host:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../configs/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-bsopt}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bsopt-network

  # === Connection Pooler ===
  pgbouncer:
    image: docker.io/edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      AUTH_TYPE: scram-sha-256
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-bsopt}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      MAX_PREPARED_STATEMENTS: 100
      ADMIN_USERS: ${POSTGRES_USER:-admin}
      STATS_PERIOD: 60
      SERVER_TLS_SSLMODE: verify-full
      SERVER_TLS_CA_FILE: /etc/pgbouncer/root_ca.crt
      SERVER_TLS_CERT_FILE: /etc/pgbouncer/pgbouncer.crt
      SERVER_TLS_KEY_FILE: /tmp/pgbouncer.key
      CLIENT_TLS_SSLMODE: verify-full
      CLIENT_TLS_CA_FILE: /etc/pgbouncer/root_ca.crt
      CLIENT_TLS_CERT_FILE: /etc/pgbouncer/pgbouncer.crt
      CLIENT_TLS_KEY_FILE: /tmp/pgbouncer.key
    ports:
      - "127.0.0.1:6433:5432"
    deploy:
      resources:
        limits:
          memory: 512mb
    user: root
    entrypoint: >
      sh -c "
      cp /etc/pgbouncer/pgbouncer.key.host /tmp/pgbouncer.key &&
      chown 70:70 /tmp/pgbouncer.key &&
      chmod 600 /tmp/pgbouncer.key &&
      exec /entrypoint.sh pgbouncer /etc/pgbouncer/pgbouncer.ini
      "
    volumes:
      - ../../.pki/pgbouncer.crt:/etc/pgbouncer/pgbouncer.crt:ro
      - ../../.pki/pgbouncer.key:/etc/pgbouncer/pgbouncer.key.host:ro
      - ../../.pki/root_ca.crt:/etc/pgbouncer/root_ca.crt:ro
    healthcheck:
      test:
        interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsopt-network

  # === Cache Service ===
  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ../configs/redis.conf:/usr/local/etc/redis/redis.conf:ro
    deploy:
      resources:
        limits:
          memory: 2.5g
    sysctls:
      - net.core.somaxconn=1024
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bsopt-network

  # === Message Broker ===
  rabbitmq:
    image: docker.io/library/rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bsopt_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../configs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    deploy:
      resources:
        limits:
          memory: 1gb
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsopt-network

  # === Object Storage (MinIO) ===
  minio:
    env_file: ../../.env
    image: docker.io/library/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 1gb
    networks:
      - bsopt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-mc:
    image: docker.io/library/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP};
      /usr/bin/mc mb --ignore-existing local/equaflow-artifacts;
      /usr/bin/mc mb --ignore-existing local/equaflow-raw-data;
      /usr/bin/mc anonymous set public local/equaflow-artifacts;
      exit 0;
      "
    networks:
      - bsopt-network

  # === Auth Service ===
  auth-service:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.auth-service
      target: development
    ports:
      - "3001:3001"
    deploy:
      resources:
        limits:
          memory: 1gb
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/auth-service.crt&sslkey=/etc/postgresql/auth-service.key
      - PGBOUNCER_ENABLED=True
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_dev_secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
    volumes:
      - ../../src/auth:/app
      - /app/node_modules
      - ../../src/shared/protos:/protos:ro
      - ../../.pki/auth-service.crt:/etc/postgresql/auth-service.crt:ro
      - ../../.pki/auth-service.key:/etc/postgresql/auth-service.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - bsopt-network

  # === API Service ===
  api:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.api
      target: development
    volumes:
      - ../../src/shared:/app/src/shared
      - ../../services/api:/app/services/api
      - ../../pyproject.toml:/app/pyproject.toml
      - shared_shm:/dev/shm
      - ../../.pki/api.crt:/etc/postgresql/api.crt:ro
      - ../../.pki/api.key:/etc/postgresql/api.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/api.crt&sslkey=/etc/postgresql/api.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
      - ML_SERVICE_GRPC_URL=ml-inference:50051
      - USE_SHM=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - bsopt-network
    sysctls:
      - net.core.somaxconn=2048
      - net.ipv4.tcp_fastopen=3
    command: granian --interface asgi services.api.main:app --host 0.0.0.0 --port 8000 --workers 4 --backlog 2048 --loop uvloop --ws

  # === Portfolio Service ===
  portfolio:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.api
      target: development
    volumes:
      - ../../src/shared:/app/src/shared
      - ../../src/portfolio:/app/src/portfolio
      - ../../pyproject.toml:/app/pyproject.toml
      - ../../.pki/portfolio.crt:/etc/postgresql/portfolio.crt:ro
      - ../../.pki/portfolio.key:/etc/postgresql/portfolio.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    ports:
      - "8003:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2gb
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/portfolio.crt&sslkey=/etc/postgresql/portfolio.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_dev_secret}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - bsopt-network
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_fastopen=3
    command: granian --interface asgi src.portfolio.main:app --host 0.0.0.0 --port 8000 --workers 2 --loop uvloop --opt

  # === [Specialized] ML Inference Manifold ===
  ml-inference:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.api
      target: development
    ports:
      - "5001:5001"
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/ml-inference.crt&sslkey=/etc/postgresql/ml-inference.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
      - ML_SERVICE_PORT=5001
      - ML_SERVICE_GRPC_URL=0.0.0.0:50051
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      - MLFLOW_S3_UPLOAD_CONCURRENCY=5
      - MLFLOW_S3_DOWNLOAD_CONCURRENCY=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - bsopt-network
    volumes:
      - ../../src/shared:/app/src/shared
      - ../../src/ml:/app/src/ml
      - ../../models:/app/models
      - ../../.pki/ml-inference.crt:/etc/postgresql/ml-inference.crt:ro
      - ../../.pki/ml-inference.key:/etc/postgresql/ml-inference.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    command: granian --interface asgi src.ml.serving.serve:app --host 0.0.0.0 --port 5001 --workers 4 --loop uvloop --ws

  # === Worker Service ===
  worker:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.worker
      target: development
    volumes:
      - ../../src/shared:/app/src/shared
      - ../../pyproject.toml:/app/pyproject.toml
      - shared_shm:/dev/shm
      - ../../.pki/worker.crt:/etc/postgresql/worker.crt:ro
      - ../../.pki/worker.key:/etc/postgresql/worker.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    ports:
      - "50052:50051" # Changed to avoid collision if run on host
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2gb
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/worker.crt&sslkey=/etc/postgresql/worker.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-bsopt_admin}:${RABBITMQ_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@rabbitmq:5672//
      - ML_SERVICE_GRPC_URL=ml-inference:50051
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_dev_secret}
      - USE_SHM=1
    healthcheck:
      test: [ "CMD-SHELL", "celery -A src.workers.tasks.celery_app inspect ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ml-inference:
        condition: service_started
    pull_policy: build
    networks:
      - bsopt-network
    command: celery -A src.workers.tasks.celery_app worker -l info --concurrency=4 --prefetch-multiplier=1

  # === NSE Scraper Service ===
  nse-scraper:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.scraper
      target: production
    ports:
      - "8002:8000"
    volumes:
      - ../../src/shared:/app/src/shared
      - shared_shm:/dev/shm
      - ../../.pki/nse-scraper.crt:/etc/postgresql/nse-scraper.crt:ro
      - ../../.pki/nse-scraper.key:/etc/postgresql/nse-scraper.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1gb
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/nse-scraper.crt&sslkey=/etc/postgresql/nse-scraper.key
      - INSIDE_DOCKER=1
    depends_on:
      - ingestion-service
      - pgbouncer
    networks:
      - bsopt-network
    command: python src/ingestion/engine.py

  # === yfinance Scraper Service ===
  yfinance-scraper:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.scraper
      target: production
    ports:
      - "8004:8000"
    volumes:
      - ../../src/shared:/app/src/shared
      - ../../.pki/yfinance-scraper.crt:/etc/postgresql/yfinance-scraper.crt:ro
      - ../../.pki/yfinance-scraper.key:/etc/postgresql/yfinance-scraper.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1gb
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/yfinance-scraper.crt&sslkey=/etc/postgresql/yfinance-scraper.key
      - INSIDE_DOCKER=1
    depends_on:
      - ingestion-service
      - pgbouncer
    networks:
      - bsopt-network
    command: python src/ingestion/yfinance_scraper.py

  # === Generic Scraper Service ===
  scraper:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.scraper
      target: production
    volumes:
      - ../../src/shared:/app/src/shared
      - shared_shm:/dev/shm
      - ../../.pki/scraper.crt:/etc/postgresql/scraper.crt:ro
      - ../../.pki/scraper.key:/etc/postgresql/scraper.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1gb
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/scraper.crt&sslkey=/etc/postgresql/scraper.key
      - INSIDE_DOCKER=1
    depends_on:
      - ingestion-service
      - pgbouncer
    networks:
      - bsopt-network

  # === Neural Pricing Service ===
  neural-pricing:
    env_file: ../../.env
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.neural-pricing
      target: development
    ports:
      - "8001:8000"
    volumes:
      - ../../src/shared:/app/src/shared
      - shared_shm:/dev/shm
      - ../../.pki/neural-pricing.crt:/etc/postgresql/neural-pricing.crt:ro
      - ../../.pki/neural-pricing.key:/etc/postgresql/neural-pricing.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/neural-pricing.crt&sslkey=/etc/postgresql/neural-pricing.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_dev_secret}
      - USE_SHM=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - bsopt-network
    sysctls:
      - net.core.somaxconn=2048
      - net.ipv4.tcp_fastopen=3
    command: granian --interface asgi src.quant.pricing.main:app --host 0.0.0.0 --port 8000 --workers 4 --backlog 2048 --loop uvloop --opt --ws

    # === App Gateway (Node.js Federation) ===
  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.frontend
      target: development
    ports:
      - "5173:5173"
    deploy:
      resources:
        limits:
          memory: 1gb
    volumes:
      - ../../src/frontend:/app
      - /app/node_modules
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      envoy:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - bsopt-network

  # === [Specialized] Test Runner ===
  test-runner:
    profiles: [ "test", "benchmark" ]
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.ci
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt_test?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/test-runner.crt&sslkey=/etc/postgresql/test-runner.key
      - REDIS_URL=redis://:${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@redis:6379/1
      - JWT_SECRET=test_secret_key_change_me_in_prod
    volumes:
      - .:/app
      - ../../.pki/test-runner.crt:/etc/postgresql/test-runner.crt:ro
      - ../../.pki/test-runner.key:/etc/postgresql/test-runner.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - bsopt-network

  # === [Specialized] Blockchain Service ===
  geth:
    profiles: [ "blockchain" ]
    image: docker.io/library/ethereum/client-go:stable
    ports:
      - "8545:8545"
      - "8546:8546"
    deploy:
      resources:
        limits:
          memory: 2gb
    networks:
      - bsopt-network

  blockchain-worker:
    profiles: [ "blockchain" ]
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.worker
      target: development
    deploy:
      resources:
        limits:
          memory: 1gb
    environment:
      - BLOCKCHAIN_RPC_URL=http://geth:8545
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - DEFI_CONTRACTS=${DEFI_CONTRACTS:-}
    depends_on:
      - geth
      - redis
    networks:
      - bsopt-network
    command: python src/blockchain/worker.py

  # === [Specialized] ML Compute Cluster ===
  ray-head:
    profiles: [ "ml" ]
    image: docker.io/library/rayproject/ray:latest-py312-cpu
    ports:
      - "8265:8265" # Dashboard
      - "10001:10001" # Ray Client
      - "8080:8080" # Ray Metrics
    networks:
      - bsopt-network
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/ray-head.crt&sslkey=/etc/postgresql/ray-head.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
    volumes:
      - ../../:/app
      - ../../.pki/ray-head.crt:/etc/postgresql/ray-head.crt:ro
      - ../../.pki/ray-head.key:/etc/postgresql/ray-head.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8265/"]
      interval: 10s
      timeout: 5s
      retries: 5
    working_dir: /app
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --include-dashboard=true --metrics-export-port=8080 --object-store-memory=2147483648 --block

  ray-worker-1:
    profiles: [ "ml" ]
    image: docker.io/library/rayproject/ray:latest-py312-cpu
    depends_on:
      - ray-head
    environment:
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/ray-worker-1.crt&sslkey=/etc/postgresql/ray-worker-1.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
    networks:
      - bsopt-network
    volumes:
      - ../../:/app
      - ../../.pki/ray-worker-1.crt:/etc/postgresql/ray-worker-1.crt:ro
      - ../../.pki/ray-worker-1.key:/etc/postgresql/ray-worker-1.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    working_dir: /app
    command: ray start --address=ray-head:6379 --metrics-export-port=8080 --object-store-memory=2147483648 --block

  rl-training-worker:
    profiles: [ "ml" ]
    image: docker.io/library/rayproject/ray:latest-py312-cpu
    depends_on:
      - ray-head
    environment:
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/rl-training-worker.crt&sslkey=/etc/postgresql/rl-training-worker.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
    networks:
      - bsopt-network
    volumes:
      - ../../:/app
      - ../../.pki/rl-training-worker.crt:/etc/postgresql/rl-training-worker.crt:ro
      - ../../.pki/rl-training-worker.key:/etc/postgresql/rl-training-worker.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    working_dir: /app
    command: ray start --address=ray-head:6379 --metrics-export-port=8080 --object-store-memory=2147483648 --block

  # === [Specialized] MLOps Tracking Server ===
  mlflow:
    env_file: ../../.env
    profiles: [ "ml" ]
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/mlflow.crt&sslkey=/etc/postgresql/mlflow.key
      - MLFLOW_ARTIFACT_ROOT=s3://equaflow-artifacts/mlflow
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      - MLFLOW_S3_UPLOAD_CONCURRENCY=10
      - MLFLOW_S3_DOWNLOAD_CONCURRENCY=10
    volumes:
      - ../../mlruns:/app/mlruns
      - ../../.pki/mlflow.crt:/etc/postgresql/mlflow.crt:ro
      - ../../.pki/mlflow.key:/etc/postgresql/mlflow.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - bsopt-network
    command: mlflow server --workers 8 --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/mlflow.crt&sslkey=/etc/postgresql/mlflow.key --default-artifact-root s3://equaflow-artifacts/mlflow

  # === [Specialized] MLOps Pipeline Worker ===
  mlops-worker:
    env_file: ../../.env
    profiles: [ "ml" ]
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.mlops
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          memory: 4gb
          cpus: '4'
    depends_on:
      - mlflow
      - ray-head
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/mlops-worker.crt&sslkey=/etc/postgresql/mlops-worker.key
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
      - RAY_WORKERS=4
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      - MLFLOW_S3_UPLOAD_CONCURRENCY=5
      - MLFLOW_S3_DOWNLOAD_CONCURRENCY=5
    command: ["mlflow", "run", ".", "--entry-point", "watchdog", "--env-manager", "local"]
    networks:
      - bsopt-network
    volumes:
      - ../../:/app
      - ../../mlruns:/app/mlruns
      - ../../.pki/mlops-worker.crt:/etc/postgresql/mlops-worker.crt:ro
      - ../../.pki/mlops-worker.key:/etc/postgresql/mlops-worker.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro

  # === [Specialized] HFT Manifold Launcher ===
  manifold:
    profiles: [ "hft" ]
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.worker
      target: production
    network_mode: host
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          memory: 2gb
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - MESH_NAME=bsopt_hft_mesh
      - MESH_SIZE_MB=256
      - LATENCY_CRITICAL_MS=50
      - DATABASE_URL=${DATABASE_URL_LOCAL:-postgresql://admin:password@localhost:5434/bsopt}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@localhost:6379/0
    command: python scripts/hft/bs_hft_launch.py

  ingestion-service:
    env_file: ../../.env
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.api
      target: development
    ports:
      - "50053:50053"
    environment:
      - PYTHONPATH=/app
      - INSIDE_DOCKER=1
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/ingestion-service.crt&sslkey=/etc/postgresql/ingestion-service.key
    depends_on:
      - pgbouncer
    networks:
      - bsopt-network
    volumes:
      - ../../.pki/ingestion-service.crt:/etc/postgresql/ingestion-service.crt:ro
      - ../../.pki/ingestion-service.key:/etc/postgresql/ingestion-service.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    deploy:
      resources:
        limits:
          memory: 1gb
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.tcp_fastopen=3
    command: python src/ingestion/ingestion_service.py

  transformer:
    env_file: ../../.env
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.api
      target: development
    environment:
      - PYTHONPATH=/app
      - INSIDE_DOCKER=1
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/transformer.crt&sslkey=/etc/postgresql/transformer.key
    depends_on:
      - ingestion-service
      - pgbouncer
    networks:
      - bsopt-network
    volumes:
      - ../../.pki/transformer.crt:/etc/postgresql/transformer.crt:ro
      - ../../.pki/transformer.key:/etc/postgresql/transformer.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/keys/vault.key:ro
    deploy:
      resources:
        limits:
          memory: 1gb
    command: python src/ingestion/concurrent_ingestion.py

  envoy:
    env_file: ../../.env
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.envoy
    ports:
      - "80:8080"
      - "443:443"
      - "9901:9901"
    volumes:
      - ../configs/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ../../.pki:/etc/envoy/ssl:ro
    depends_on:
      - api
      - auth-service
      - neural-pricing
      - ml-inference
    networks:
      - bsopt-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9901/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.tcp_fastopen=3
    deploy:
      resources:
        limits:
          memory: 512mb

  rust-core:
    env_file: ../../.env
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.rust-core
    volumes:
      - ../../:/app
      - shared_shm:/dev/shm
    networks:
      - bsopt-network
    environment:
      - INSIDE_DOCKER=1
    working_dir: /app/src/math_kernel/rust-core

  # === [Specialized] Observability Stack ===
  # === Monitoring Service ===
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@postgres:5432/bsopt?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bsopt-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9121/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bsopt-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ../monitoring/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ../monitoring/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bsopt-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bsopt-network

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bsopt-network

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../monitoring/monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter
      - "13133:13133" # Health check extension
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bsopt-network

  frontend-test:
    profiles: [ "test" ]
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.frontend
      target: development
    volumes:
      - ../../src/frontend:/app
      - /app/node_modules
    networks:
      - bsopt-network
    command: npm run test -- --run

  e2e-test:
    profiles: [ "test" ]
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    working_dir: /app/src/frontend
    volumes:
      - .:/app
    environment:
      - PLAYWRIGHT_TEST_BASE_URL=http://frontend:5173
    networks:
      - bsopt-network
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.tcp_fastopen=3
    depends_on:
      - frontend
      - auth-service
      - api
    command: npx playwright test

networks:
  bsopt-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"
      com.docker.network.bridge.name: "bsopt0"
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  shared_shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4096m"
