name: bsopt

services:
  
  base:
    pull_policy: build
    ports:
      - "3001:3001"
    deploy:
      resources:
        limits:
          memory: 1gb
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/auth-service.crt&sslkey=/etc/postgresql/auth-service.key
      - PGBOUNCER_ENABLED=True
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_dev_secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
      - BSOPT_ALLOW_WEAK_SECRETS=True
      - PYTHONPATH=/app:/app/src/protos
    security_opt:
      - label:disable
    command: ["python3", "/app/src/auth/auth_server.py"]
    volumes:
      - ../../src:/app/src:rw
      - /app/src/auth/node_modules
      - ../../src/shared/protos:/protos:ro
      - ../../.pki/auth-service.crt:/etc/postgresql/auth-service.crt:ro
      - ../../.pki/auth-service.key:/etc/postgresql/auth-service.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - bsopt-network

  # === API Service ===
  api:
    env_file: ../../.env
    pull_policy: never
    security_opt:
      - label:disable
    volumes:
      - ../../src:/app/src:rw
      - /app/services/api/node_modules
      - ../../pyproject.toml:/app/pyproject.toml:ro
      - shared_shm:/dev/shm
      - ../../.pki/api.crt:/etc/postgresql/api.crt:ro
      - ../../.pki/api.key:/etc/postgresql/api.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - PATH=/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/api.crt&sslkey=/etc/postgresql/api.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
      - ML_SERVICE_GRPC_URL=ml-inference:50051
      - USE_SHM=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - bsopt-network
    sysctls:
      - net.core.somaxconn=2048
      - net.ipv4.tcp_fastopen=3
    entrypoint: ["/usr/local/bin/entrypoint-shim.sh"]
    command: granian --interface asgi api.index:app --host 0.0.0.0 --port 8000 --workers 4 --backlog 2048 --loop uvloop --ws

  # === Portfolio Service ===
  portfolio:
    image: manifold-base:latest
    env_file: ../../.env
    pull_policy: never
    volumes:
      - ../../src:/app/src
      - ../../api:/app/api
      - ../../pyproject.toml:/app/pyproject.toml
      - ../../.pki/portfolio.crt:/etc/postgresql/portfolio.crt:ro
      - ../../.pki/portfolio.key:/etc/postgresql/portfolio.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key
    ports:
      - "8003:8000"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2gb
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/portfolio.crt&sslkey=/etc/postgresql/portfolio.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_dev_secret}
      - BSOPT_ALLOW_WEAK_SECRETS=True
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - bsopt-network
    sysctls:
      - net.core.somaxconn=1024
      - net.ipv4.tcp_fastopen=3
    command: granian --interface asgi src.portfolio.main:app --host 0.0.0.0 --port 8000 --workers 2 --loop uvloop

  # === [Specialized] ML Inference Manifold ===
  ml-inference:
    env_file: ../../.env
    pull_policy: never
    ports:
      - "5001:5001"
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/ml-inference.crt&sslkey=/etc/postgresql/ml-inference.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
      - ML_SERVICE_PORT=5001
      - ML_SERVICE_GRPC_URL=0.0.0.0:50051
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      - MLFLOW_S3_UPLOAD_CONCURRENCY=5
      - MLFLOW_S3_DOWNLOAD_CONCURRENCY=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - bsopt-network
    volumes:
      - ../../src:/app/src
      - ../../models:/app/models
      - ../../.pki/ml-inference.crt:/etc/postgresql/ml-inference.crt:ro
      - ../../.pki/ml-inference.key:/etc/postgresql/ml-inference.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key
    command: granian --interface asgi src.ml.serving.serve:app --host 0.0.0.0 --port 5001 --workers 4 --loop uvloop --ws

  # === Worker Service ===
  worker:
    image: manifold-base:latest
    env_file: ../../.env
    pull_policy: never
    volumes:
      - ../../src:/app/src
      - ../../pyproject.toml:/app/pyproject.toml
      - shared_shm:/dev/shm
      - ../../.pki/worker.crt:/etc/postgresql/worker.crt:ro
      - ../../.pki/worker.key:/etc/postgresql/worker.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key
    ports:
      - "50052:50051" # Changed to avoid collision if run on host
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2gb
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - PATH=/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/worker.crt&sslkey=/etc/postgresql/worker.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-bsopt_admin}:${RABBITMQ_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@rabbitmq:5672//
      - ML_SERVICE_GRPC_URL=ml-inference:50051
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_dev_secret}
      - USE_SHM=1
    healthcheck:
      test: [ "CMD-SHELL", "celery -A src.workers.tasks.celery_app inspect ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ml-inference:
        condition: service_started
    networks:
      - bsopt-network
    command: celery -A src.workers.tasks.celery_app worker -l info --concurrency=4 --prefetch-multiplier=1

  # === NSE Scraper Service ===
  nse-scraper:
    image: manifold-base:latest
    env_file: ../../.env
    pull_policy: never
    security_opt:
      - label:disable
    ports:
      - "8002:8000"
    volumes:
      - ../../src:/app/src:rw
      - shared_shm:/dev/shm
      - ../../.pki/nse-scraper.crt:/etc/postgresql/nse-scraper.crt:ro
      - ../../.pki/nse-scraper.key:/etc/postgresql/nse-scraper.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1gb
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/nse-scraper.crt&sslkey=/etc/postgresql/nse-scraper.key
      - INSIDE_DOCKER=1
    depends_on:
      - ingestion-service
      - pgbouncer
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import time, os; t=float(open('/tmp/scraper_heartbeat').read()); exit(0 if time.time()-t < 60 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bsopt-network
    command: python src/ingestion/engine.py

  # === yfinance Scraper Service ===
  yfinance-scraper:
    image: manifold-base:latest
    image: manifold-base:latest
    env_file: ../../.env
    pull_policy: never
    security_opt:
      - label:disable
    ports:
      - "8004:8000"
    volumes:
      - ../../src:/app/src:rw
      - ../../.pki/yfinance-scraper.crt:/etc/postgresql/yfinance-scraper.crt:ro
      - ../../.pki/yfinance-scraper.key:/etc/postgresql/yfinance-scraper.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1gb
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/yfinance-scraper.crt&sslkey=/etc/postgresql/yfinance-scraper.key
      - INSIDE_DOCKER=1
    depends_on:
      - ingestion-service
      - pgbouncer
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import time, os; t=float(open('/tmp/scraper_heartbeat').read()); exit(0 if time.time()-t < 60 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bsopt-network
    command: python src/ingestion/yfinance_scraper.py

  # === Generic Scraper Service ===
  scraper:
    image: manifold-base:latest
    image: manifold-base:latest
    env_file: ../../.env
    pull_policy: never
    security_opt:
      - label:disable
    volumes:
      - ../../src:/app/src:rw
      - shared_shm:/dev/shm
      - ../../.pki/scraper.crt:/etc/postgresql/scraper.crt:ro
      - ../../.pki/scraper.key:/etc/postgresql/scraper.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1gb
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/scraper.crt&sslkey=/etc/postgresql/scraper.key
      - INSIDE_DOCKER=1
    depends_on:
      - ingestion-service
      - pgbouncer
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import time, os; t=float(open('/tmp/scraper_heartbeat').read()); exit(0 if time.time()-t < 60 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bsopt-network

  # === Neural Pricing Service ===
  neural-pricing:
    image: manifold-base:latest
    image: manifold-base:latest
    env_file: ../../.env
    pull_policy: never
    ports:
      - "8001:8000"
    volumes:
      - ../../src:/app/src
      - shared_shm:/dev/shm
      - ../../.pki/neural-pricing.crt:/etc/postgresql/neural-pricing.crt:ro
      - ../../.pki/neural-pricing.key:/etc/postgresql/neural-pricing.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4gb
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/neural-pricing.crt&sslkey=/etc/postgresql/neural-pricing.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - JWT_SECRET=${JWT_SECRET:-local_dev_secret}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-local_dev_secret}
      - USE_SHM=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - bsopt-network
    sysctls:
      - net.core.somaxconn=2048
      - net.ipv4.tcp_fastopen=3
    command: granian --interface asgi src.quant.pricing.main:app --host 0.0.0.0 --port 8000 --workers 4 --backlog 2048 --loop uvloop --ws

    # === App Gateway (Node.js Federation) ===
  frontend:
    image: manifold-base:latest
    pull_policy: never
    ports:
      - "5173:5173"
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 256mb
    volumes:
      - ../../src/frontend:/app
      - /app/node_modules
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5173/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bsopt-network

  # === [Specialized] Test Runner ===
  test-runner:
    image: manifold-base:latest
    image: manifold-base:latest
    profiles: [ "test", "benchmark" ]
    pull_policy: never
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          memory: 1gb
    environment:
      - BLOCKCHAIN_RPC_URL=http://geth:8545
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - DEFI_CONTRACTS=${DEFI_CONTRACTS:-}
    depends_on:
      - geth
      - redis
    networks:
      - bsopt-network
    command: python src/blockchain/worker.py

  # === [Specialized] ML Compute Cluster ===
  ray-head:
    profiles: [ "ml" ]
    image: docker.io/rayproject/ray:latest-py312-cpu
    ports:
      - "8265:8265" # Dashboard
      - "10001:10001" # Ray Client
      - "8080:8080" # Ray Metrics
    networks:
      - bsopt-network
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/ray-head.crt&sslkey=/etc/postgresql/ray-head.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
      - RAY_memory_usage_threshold=0.95
      - RAY_task_rpc_timeout_ms=5000
      - RAY_worker_register_timeout_seconds=600
    volumes:
      - ../../:/app
      - ../../.pki/ray-head.crt:/etc/postgresql/ray-head.crt:ro
      - ../../.pki/ray-head.key:/etc/postgresql/ray-head.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6gb
        reservations:
          memory: 2gb
    healthcheck:
      test: ["CMD-SHELL", "ray status || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
    working_dir: /app
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --include-dashboard=true --metrics-export-port=8080 --object-store-memory=2147483648 --num-cpus=2 --block

  ray-worker-1:
    profiles: [ "ml" ]
    image: docker.io/rayproject/ray:latest-py312-cpu
    depends_on:
      ray-head:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ray status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/ray-worker-1.crt&sslkey=/etc/postgresql/ray-worker-1.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
      - RAY_memory_usage_threshold=0.95
      - RAY_task_rpc_timeout_ms=5000
    networks:
      - bsopt-network
    volumes:
      - ../../:/app
      - ../../.pki/ray-worker-1.crt:/etc/postgresql/ray-worker-1.crt:ro
      - ../../.pki/ray-worker-1.key:/etc/postgresql/ray-worker-1.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8gb
        reservations:
          memory: 2gb
    working_dir: /app
    command: ray start --address=ray-head:6379 --metrics-export-port=8080 --object-store-memory=3221225472 --num-cpus=4 --block

  rl-training-worker:
    profiles: [ "ml" ]
    image: docker.io/rayproject/ray:latest-py312-cpu
    depends_on:
      mlflow:
        condition: service_healthy
      ray-head:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ray status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/rl-training-worker.crt&sslkey=/etc/postgresql/rl-training-worker.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
      - RAY_memory_usage_threshold=0.95
    networks:
      - bsopt-network
    volumes:
      - ../../:/app
      - ../../.pki/rl-training-worker.crt:/etc/postgresql/rl-training-worker.crt:ro
      - ../../.pki/rl-training-worker.key:/etc/postgresql/rl-training-worker.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key
    shm_size: '4gb'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3gb
        reservations:
          memory: 1gb
    working_dir: /app
    command: ray start --address=ray-head:6379 --metrics-export-port=8080 --object-store-memory=1073741824 --block

  # === [Specialized] MLOps Tracking Server ===
  mlflow:
    env_file: ../../.env
    profiles: [ "ml" ]
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/mlflow.crt&sslkey=/etc/postgresql/mlflow.key
      - PGSSLMODE=verify-full
      - PGSSLROOTCERT=/etc/postgresql/ca.crt
      - PGSSLCERT=/etc/postgresql/mlflow.crt
      - PGSSLKEY=/etc/postgresql/mlflow.key
      - MLFLOW_ARTIFACT_ROOT=s3://Manifold-artifacts/mlflow
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio_admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      - MLFLOW_S3_UPLOAD_CONCURRENCY=10
      - MLFLOW_S3_DOWNLOAD_CONCURRENCY=10
    volumes:
      - ../../mlruns:/app/mlruns
      - ../../.pki/mlflow.crt:/etc/postgresql/mlflow.crt:ro
      - ../../.pki/mlflow.key:/etc/postgresql/mlflow.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 512mb
    networks:
      - bsopt-network
    command: ["mlflow", "server", "--workers", "2", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/mlflow.crt&sslkey=/etc/postgresql/mlflow.key", "--default-artifact-root", "s3://Manifold-artifacts/mlflow"]

  # === [Specialized] MLOps Pipeline Worker ===
  mlops-worker:
    image: manifold-base:latest
    image: manifold-base:latest
    env_file: ../../.env
    profiles: [ "ml" ]
    pull_policy: never
    security_opt:
      - label:disable
    ports:
      - "50053:50053"
    environment:
      - PYTHONPATH=/app
      - INSIDE_DOCKER=1
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/ingestion-service.crt&sslkey=/etc/postgresql/ingestion-service.key
    depends_on:
      - pgbouncer
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import time, os; t=float(open('/tmp/ingestion_heartbeat').read()); exit(0 if time.time()-t < 60 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bsopt-network
    volumes:
      - ../../.pki/ingestion-service.crt:/etc/postgresql/ingestion-service.crt:ro
      - ../../.pki/ingestion-service.key:/etc/postgresql/ingestion-service.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    deploy:
      resources:
        limits:
          memory: 1gb
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.tcp_fastopen=3
    command: python src/ingestion/ingestion_service.py

  transformer:
    image: manifold-base:latest
    image: manifold-base:latest
    env_file: ../../.env
    pull_policy: never
    environment:
      - PYTHONPATH=/app
      - INSIDE_DOCKER=1
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/bsopt?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/transformer.crt&sslkey=/etc/postgresql/transformer.key
    depends_on:
      - ingestion-service
      - pgbouncer
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import time, os; t=float(open('/tmp/transformer_heartbeat').read()); exit(0 if time.time()-t < 60 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bsopt-network
    volumes:
      - ../../.pki/transformer.crt:/etc/postgresql/transformer.crt:ro
      - ../../.pki/transformer.key:/etc/postgresql/transformer.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    deploy:
      resources:
        limits:
          memory: 1gb
    command: python src/ingestion/concurrent_ingestion.py

  envoy:
    image: docker.io/envoyproxy/envoy:v1.28-latest
    env_file: ../../.env
    pull_policy: if_not_present
    volumes:
      - ../configs/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ../../.pki:/etc/envoy/ssl:ro
    ports:
      - "8081:8080"
      - "80:8080"
      - "443:443"
      - "9901:9901"
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--concurrency", "0", "--log-level", "info"]
    depends_on:
      - api
      - auth-service
      - ml-inference
      - nginx
    networks:
      - bsopt-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9901/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    sysctls:
      - net.core.somaxconn=16384
      - net.ipv4.tcp_fastopen=3
      - net.ipv4.tcp_tw_reuse=1
      - net.ipv4.tcp_fin_timeout=15
      - net.ipv4.tcp_max_syn_backlog=8192
    deploy:
      resources:
        limits:
          memory: 512mb
        reservations:
          memory: 128mb

  nginx:
    image: docker.io/library/nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../.pki:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256mb
        reservations:
          memory: 64mb
    networks:
      - bsopt-network

  rust-core:
    image: manifold-base:latest
    image: manifold-base:latest
    env_file: ../../.env
    pull_policy: never
    volumes:
      - ../../src/frontend:/app
      - /app/node_modules
    networks:
      - bsopt-network
    command: npm run test -- --run

  e2e-test:
    profiles: [ "test" ]
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    working_dir: /app/src/frontend
    volumes:
      - .:/app
    environment:
      - PLAYWRIGHT_TEST_BASE_URL=http://frontend:5173
    networks:
      - bsopt-network
    sysctls:
      - net.core.somaxconn=4096
      - net.ipv4.tcp_fastopen=3
    depends_on:
      - frontend
      - auth-service
      - api
    command: npx playwright test

networks:
  bsopt-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"
      com.docker.network.bridge.name: "bsopt0"
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  postgres_data:
  redis_data:
  minio_data:
    driver: local
  prometheus_data:
  grafana_data:
  loki_data:
  shared_shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=7168m"
  geth_data:
