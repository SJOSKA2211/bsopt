name: bsopt

services:
  # === Database & Infrastructure ===
  postgres:
    image: docker.io/timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command: >
      sh -c "
      cp /etc/postgresql/postgres.key.host /tmp/postgres.key &&
      chown 70:70 /tmp/postgres.key &&
      chmod 600 /tmp/postgres.key &&
      exec docker-entrypoint.sh postgres 
      -c 'config_file=/etc/postgresql/postgresql.conf' 
      -c 'hba_file=/etc/postgresql/pg_hba.conf' 
      -c 'ident_file=/etc/postgresql/pg_ident.conf' 
      -c 'ssl_key_file=/tmp/postgres.key'
      "
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bsopt}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5435:5432"
    shm_size: '1gb'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infrastructure/init-scripts/init-scripts:/docker-entrypoint-initdb.d:ro
      - ../../src/shared/migrations:/migrations:ro
      - ../configs/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../configs/pg_hba.conf:/etc/postgresql/pg_hba.conf:rw
      - ../../.pki/postgres.crt:/etc/postgresql/postgres.crt:ro
      - ../../.pki/postgres.key:/etc/postgresql/postgres.key.host:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../configs/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-bsopt}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bsopt-network

  pgbouncer:
    image: docker.io/edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-bsopt}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 300
    entrypoint: >
      sh -c "
      cp /etc/pgbouncer/pgbouncer.key.host /tmp/pgbouncer.key &&
      chown 70:70 /tmp/pgbouncer.key &&
      chmod 600 /tmp/pgbouncer.key &&
      exec /entrypoint.sh pgbouncer /etc/pgbouncer/pgbouncer.ini
      "
    volumes:
      - ../../.pki/pgbouncer.crt:/etc/pgbouncer/pgbouncer.crt:ro,Z
      - ../../.pki/pgbouncer.key:/etc/pgbouncer/pgbouncer.key.host:ro,Z
      - ../../.pki/root_ca.crt:/etc/pgbouncer/root_ca.crt:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGSSLCERT=/etc/pgbouncer/pgbouncer.crt PGSSLKEY=/tmp/pgbouncer.key PGSSLROOTCERT=/etc/pgbouncer/root_ca.crt pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsopt-network

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ../configs/redis.conf:/usr/local/etc/redis/redis.conf:ro,Z
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bsopt-network

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bsopt_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ../configs/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro,Z
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro,Z
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsopt-network

  # === Core Services ===
  auth-service:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.auth
      target: production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/auth-service.crt&sslkey=/etc/postgresql/auth-service.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}
      - BSOPT_ALLOW_WEAK_SECRETS=True
    volumes:
      - ../../.pki/auth-service.crt:/etc/postgresql/auth-service.crt:ro
      - ../../.pki/auth-service.key:/etc/postgresql/auth-service.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsopt-network

  api:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.api
      target: production
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/api.crt&sslkey=/etc/postgresql/api.key
      - PGBOUNCER_ENABLED=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
      - USE_SHM=1
    volumes:
      - shared_shm:/dev/shm
      - ../../.pki/api.crt:/etc/postgresql/api.crt:ro
      - ../../.pki/api.key:/etc/postgresql/api.key:ro
      - ../../.pki/root_ca.crt:/etc/postgresql/ca.crt:ro
      - ../../.pki/vault.key:/app/vault.key:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - bsopt-network

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.worker
      target: production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@pgbouncer:6432/${POSTGRES_DB:-bsopt}?sslmode=verify-full&sslrootcert=/etc/postgresql/ca.crt&sslcert=/etc/postgresql/worker.crt&sslkey=/etc/postgresql/worker.key
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-bsopt_admin}:${RABBITMQ_PASSWORD:-REQUIRED_SET_BY_BOOTSTRAP}@rabbitmq:5672//
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bsopt-network

  # === Frontend & Gateway ===
  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/orchestration/Dockerfile.frontend
      target: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bsopt-network

  nginx:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../.pki:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - bsopt-network

networks:
  bsopt-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  shared_shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=7168m"
