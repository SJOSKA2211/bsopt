user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 200000;
thread_pool default threads=32 max_queue=65536;

events {
    use epoll;
    multi_accept on;
    worker_connections 65535;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    aio threads=default;
    directio 512;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Brotli/Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Optimized Timeouts
    keepalive_timeout 65;
    keepalive_requests 100000;
    client_body_timeout 15;
    client_header_timeout 15;
    send_timeout 15;

    # Buffer Tuning
    client_body_buffer_size 1m;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Proxy Buffer Tuning
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Permitted-Cross-Domain-Policies "none";

    server_tokens off;

    # Upstreams (Standardized Keepalive Pooling)
    upstream auth_backend {
        server auth-service:3001;
        keepalive 1024;
    }
    upstream api_backend {
        server api:8000;
        keepalive 1024;
    }
    upstream portfolio_backend {
        server portfolio:8000;
        keepalive 1024;
    }
    upstream ml_backend {
        server ml-inference:5001;
        keepalive 1024;
    }
    upstream pricing_backend {
        server neural-pricing:8000;
        keepalive 1024;
    }
    upstream frontend_backend {
        server frontend:5173;
        keepalive 1024;
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        
        # Performance & Security hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling off; # Disabled for internal CA
        ssl_stapling_verify off;

        # Static Frontend (App Gateway Entry)
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health endpoint for Envoy/Internal
        location /health {
            access_log off;
            return 200 'healthy';
            add_header Content-Type text/plain;
        }
    }
}
