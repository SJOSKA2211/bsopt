# ----------------------------------------
# PostgreSQL Configuration (The Orchestrator - High-Performance Optimized)
# Target: 4GB RAM Container
# Postgres Version: 16 + TimescaleDB 2.17+
# ----------------------------------------

# --- Connectivity ---
listen_addresses = '*'
max_connections = 100
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = 5min
lock_timeout = 30s
statement_timeout = 10min
max_locks_per_transaction = 256  # Enhanced for TimescaleDB Hypertables

# --- Logging & Security ---
log_connections = on
log_disconnections = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_error_verbosity = default
track_io_timing = on

# --- Memory Settings (Optimized for 4GB RAM, NVMe-backed host) ---
shared_buffers = 1GB         # 25% of RAM is safe for PG
effective_cache_size = 3GB   # 75% of RAM
work_mem = 64MB              # Increased for complex BS-OPT analytical joins
maintenance_work_mem = 512MB # Speeds up indexing on large hypertables
temp_buffers = 128MB
huge_pages = try

# --- I/O & Write Optimization (NVMe Specialization) ---
random_page_cost = 1.0       # 1.0 is optimal for NVMe where random looks like sequential
effective_io_concurrency = 300 # Higher parallelism for NVMe
wal_level = logical          # Enable CDC if needed, replica is minimum
wal_buffers = 32MB
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB
synchronous_commit = off    #  Async commit for HFT-like throughput (High-Performance Choice)

# --- Worker & Parallelism ---
max_worker_processes = 12
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
timescaledb.max_background_workers = 16 # Increased for background maintenance

# --- PG 16 Specifics (The Orchestrator) ---
vacuum_buffer_usage_limit = 512MB
logical_decoding_work_mem = 64MB
default_statistics_target = 100
jit = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# --- Autovacuum Tuning (Aggressive) ---
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.01
autovacuum_analyze_scale_factor = 0.005

# --- Extensions ---
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.track_planning = on
timescaledb.enable_chunk_skipping = on
