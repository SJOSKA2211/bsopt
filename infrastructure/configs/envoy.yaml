# ==============================================================================
# Manifold: ENVOY API GATEWAY CONFIGURATION (v2.0)
# ==============================================================================

# - Rate limiting (100 req/s per IP)
# - Circuit breaker (5xx threshold: 50%)
# - Retry policy (3 retries, exponential backoff)
# - JWT validation filter
# - Health check endpoints (/health, /ready)
# - gRPC-Web transcoding
# - Distributed tracing
# ==============================================================================

admin:
  access_log_path: /tmp/envoy_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  # ============================================================================
  # HTTP Listener (Port 8080)
  # ============================================================================
  - name: listener_http
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          
          # Request ID generation for distributed tracing
          generate_request_id: true
          preserve_external_request_id: true
          
          tracing:
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc:
                    cluster_name: opentelemetry_collector
                service_name: envoy-edge-proxy
          
          # Local reply on upstream errors
          stream_error_on_invalid_http_message: true
          
          # Upgrade configurations (WebSocket, gRPC-Web)
          upgrade_configs:
          - upgrade_type: websocket
          - upgrade_type: h2c
          
          # Route configuration
          route_config:
            name: local_route
            response_headers_to_add:
              - header: { key: "Strict-Transport-Security", value: "max-age=31536000; includeSubDomains; preload" }
              - header: { key: "X-Content-Type-Options", value: "nosniff" }
              - header: { key: "X-Frame-Options", value: "DENY" }
              - header: { key: "X-XSS-Protection", value: "1; mode=block" }
              - header: { key: "Content-Security-Policy", value: "default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none';" }
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              
              # Rate limiting per virtual host
              rate_limits:
              - stage: 0
                actions:
                - {destination_cluster: {}}
                - remote_address: {}
              
              # Routes with retry and circuit breaker
              routes:
              # Health check endpoints (bypass auth)
              - match:
                  prefix: "/health"
                route:
                  cluster: health_service
                  prefix_rewrite: "/health"
              - match:
                  prefix: "/ready"
                route:
                  cluster: health_service
                  prefix_rewrite: "/ready"
              
              # Auth service routes
              - match:
                  prefix: "/auth"
                route:
                  cluster: auth_service
                  retry_policy:
                    retry_on: "5xx,reset,connect-failure"
                    num_retries: 3
                    per_try_timeout: 5s
                    back_off:
                      base_interval: 1s
                      max_interval: 10s
                  timeout: 30s
              
              # gRPC services (use HTTP/2)
              - match:
                  prefix: "/grpc"
                route:
                  cluster: ml_inference
                  upgrade_configs:
                  - upgrade_type: grpc
                  retry_policy:
                    retry_on: "gRPC-status,cancelled,503"
                    num_retries: 3
                    retry_statuses:
                    - 503
                    - 500
                    - 429
                  timeout: 60s
              
              # ML Inference service
              - match:
                  prefix: "/ml"
                route:
                  cluster: ml_inference
                  retry_policy:
                    retry_on: "5xx,reset,connect-failure"
                    num_retries: 2
                    per_try_timeout: 30s
                  timeout: 120s
                  circuit_breakers:
                    thresholds:
                    - max_pending_requests: 100
                      max_requests: 200
                      max_connections: 100
                      max_retries: 3
              
              # API routes
              - match:
                  prefix: "/api"
                route:
                  cluster: api_service
                  retry_policy:
                    retry_on: "5xx,reset,connect-failure,retriable-status-codes"
                    num_retries: 3
                    per_try_timeout: 10s
                    back_off:
                      base_interval: 0.5s
                      max_interval: 5s
                  timeout: 60s
                  circuit_breakers:
                    thresholds:
                    - max_pending_requests: 500
                       max_requests: 1000
                       max_connections: 500
                       max_retries: 5
              
              # Neural Pricing service
              - match:
                  prefix: "/price"
                route:
                  cluster: neural_pricing
                  retry_policy:
                    retry_on: "5xx,reset,connect-failure"
                    num_retries: 3
                  timeout: 60s
              
              # WebSocket routes
              - match:
                  prefix: "/ws"
                route:
                  cluster: api_service
                  upgrade_configs:
                  - upgrade_type: websocket
                  timeout: 3600s
              
              # Default route (catch-all)
              - match:
                  prefix: "/"
                route:
                  cluster: api_service
                  retry_policy:
                    retry_on: "5xx,reset,connect-failure"
                    num_retries: 1
                    per_try_timeout: 5s
                  timeout: 30s
          
          # HTTP filters pipeline
          http_filters:
          # 1. Health filter (first, bypass everything)
          - name: envoy.filters.http.health_check
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.common.health_check.v3.HealthCheckFilter
              pass_through_mode: true
              headers:
                - name: ":path"
                  exact_match: "/health"
                - name: ":path"
                  exact_match: "/ready"
          
          # 2. Rate limiting filter (before auth)
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: http_local_rate_limiter
              token_bucket:
                max_tokens: 100
                tokens_per_fill: 100
                fill_interval: 1s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value: 1.0
          
          # 3. Router (with dynamic stats)
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: false
              start_child_span: true
              emit_dynamic_stats: true
  
  # ============================================================================
  # HTTPS Listener with TLS Termination (Port 443)
  # ============================================================================
  - name: listener_https
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 443
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain:
                filename: /etc/envoy/ssl/envoy_edge.crt
              private_key:
                filename: /etc/envoy/ssl/envoy_edge.key
            # TLS 1.3 only for modern clients
            tls_params:
              tls_maximum_protocol_version: TLSv1_3
              tls_minimum_protocol_version: TLSv1_2
              ecdh_curves:
              - X25519
              - P-256
        filter_chains_metadata_match:
          metadata_key:
            kind:
              url:
                name: cert.validator.service
                filter: envoy.tls_certificate
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_https
          codec_type: AUTO
          generate_request_id: true
          route_config:
            name: local_route_tls
            virtual_hosts:
            - name: local_service_tls
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: api_service
                  retry_policy:
                    retry_on: "5xx,reset,connect-failure"
                    num_retries: 3
                  timeout: 60s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: false
              start_child_span: true

  clusters:
  # ============================================================================
  # Service Clusters with Circuit Breaker & Health Checks
  # ============================================================================
  
  # API Service Cluster
  - name: api_service
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: LEAST_REQUEST
    load_assignment:
      cluster_name: api_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api
                port_value: 8000
          health_checks:
          - timeout: 5s
            interval: 10s
            unhealthy_threshold: 3
            healthy_threshold: 2
            http_health_check:
              path: "/health"
              expected_statuses:
              - start: 200
                end: 300
    circuit_breakers:
      thresholds:
      - max_pending_requests: 500
        max_requests: 1000
        max_connections: 500
        max_retries: 5
        retry_budget:
          budget_percent:
            value: 20
          min_retry_concurrency: 3
    health_checks:
    - timeout: 5s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2
      http_health_check:
        path: "/health"
  
  # Auth Service Cluster
  - name: auth_service
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: auth_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: auth-service
                port_value: 3001
          health_checks:
          - timeout: 5s
            interval: 10s
            unhealthy_threshold: 3
            healthy_threshold: 2
            http_health_check:
              path: "/"
              expected_statuses:
              - start: 200
                end: 299
    circuit_breakers:
      thresholds:
      - max_pending_requests: 100
        max_requests: 200
        max_connections: 100
        max_retries: 3
  
  # ML Inference Service Cluster (gRPC)
  - name: ml_inference
    connect_timeout: 10s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options:
      hpack_table_size: 4096
      max_concurrent_streams: 100
    load_assignment:
      cluster_name: ml_inference
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: ml-inference
                port_value: 50051
    circuit_breakers:
      thresholds:
      - max_pending_requests: 50
        max_requests: 100
        max_connections: 50
        max_retries: 3
  
  # Health Service Cluster (internal)
  - name: health_service
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: health_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: api
                port_value: 8000
    circuit_breakers:
      thresholds:
      - max_pending_requests: 10
        max_requests: 20
        max_connections: 10

  # Neural Pricing Service Cluster
  - name: neural_pricing
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: neural_pricing
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: neural-pricing
                port_value: 8000
          health_checks:
          - timeout: 5s
            interval: 10s
            unhealthy_threshold: 3
            healthy_threshold: 2
            http_health_check:
              path: "/health"
    circuit_breakers:
      thresholds:
      - max_pending_requests: 100
        max_requests: 200
        max_connections: 100
        max_retries: 3

  # OpenTelemetry Collector (gRPC)
  - name: opentelemetry_collector
    connect_timeout: 1s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: opentelemetry_collector
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: otel-collector
                port_value: 4317

# ============================================================================
# Runtime Configuration
# ============================================================================
layered_runtime:
  layers:
  - name: static_layer
    static_layer:
      # Circuit breaker settings
      circuit_breakers:
        "defaults":
          max_pending_requests: 500
          max_requests: 1000
          max_connections: 500
          max_retries: 5
      # Rate limiting
      local_rate_limit:
        enabled: true
      # Health check settings
      health_check:
        min_interval: 10s
        max_interval: 60s
      # Retry settings
      retry:
        default_ratelimit_timeout: 5s
  - name: runtime_layer
    runtime_layer:
      # Dynamic configuration via filesystem
      symlink_root: /etc/envoy/runtime
      watch_suffix: "*.yaml"
