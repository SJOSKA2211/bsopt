# ============================================================================
# Black-Scholes Option Pricing Platform - PostgreSQL HBA Configuration
# ============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     scram-sha-256

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# Docker Internal Networks (including standard private subnets)
# This covers Docker bridge (172.x), overlay (10.x), and other common ranges
hostssl all             all             10.0.0.0/8              scram-sha-256
hostssl all             all             172.16.0.0/12           scram-sha-256
hostssl all             all             192.168.0.0/16          scram-sha-256

# Reject all other connections (Implicit deny)
host    all             all             all                     reject
host all all 172.16.0.0/12 trust
