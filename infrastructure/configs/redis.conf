# BS-Opt  Redis Configuration

# Performance & Connectivity
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru
activedefrag yes

# Persistence ( Durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshoting (RDB as fallback)
save 900 1
save 300 10
save 60 10000

# Security
# Password is set via CLI in docker-compose for dynamic injection
# requirepass bsopt_redis_secret

# Logging
loglevel notice
logfile ""