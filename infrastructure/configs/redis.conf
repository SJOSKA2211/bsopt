# Institutional-Grade Optimized Redis Configuration for BS-Opt

# --- Network & Connectivity ---
port 6379
tcp-backlog 2048
timeout 0
tcp-keepalive 300
protected-mode yes

# --- Performance & Multi-threading ---
# Enable IO threads for high-throughput scenarios
io-threads 4
io-threads-do-reads yes

# --- Memory Management ---
# Limit memory usage to match infrastructure constraints
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Reactive defragmentation to maintain performance over time
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100

# --- Lazy Freeing (Performance) ---
# Don't block the main thread for large deletions
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes

# --- Persistence (Durability & Recovery) ---
# AOF for data safety
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshoting as secondary backup
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes

# --- Logging & Monitoring ---
loglevel notice
logfile ""
databases 16

# --- Security ---
# Note: requirepass is injected dynamically via docker-compose command
