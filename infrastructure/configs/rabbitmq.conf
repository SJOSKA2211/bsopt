# Manifold RabbitMQ Production Configuration

# Default user/pass handled via env in docker-compose
# default_user = admin
# default_pass = secret

# Memory and Disk limits
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Networking
listeners.tcp.default = 5672
management.tcp.port = 15672
heartbeat = 60

# Dead Lettering & Retries (Global settings)
# Note: Specific DLX/DLQ policies are usually applied via RabbitMQ CLI or Management API
# but we can set default exchange/queue types here.

# Enable Management Plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Performance Tuning
collect_statistics_interval = 10000
    
# Plugin Settings
auth_backends.1 = rabbit_auth_backend_internal
