# Manifold RabbitMQ Production Configuration - Optimized

# Memory and Disk limits
# With 2GB limit in docker-compose, watermark at 0.7 gives ~1.4GB for RabbitMQ
vm_memory_high_watermark.relative = 0.7
disk_free_limit.absolute = 2GB

# Networking
listeners.tcp.default = 5672
management.tcp.port = 15672
heartbeat = 60

# Advanced Resource Tuning
channel_max = 2048
connection_max = 50000

# Enable Management Plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Performance Tuning
collect_statistics_interval = 5000
    
# Plugin Settings
auth_backends.1 = rabbit_auth_backend_internal

# Credit Flow Control
# Increase the default to allow more unacknowledged messages in flight
# before blocking producers (caution: uses more memory)
# credit_flow_default_credit = {400, 200}

# Queue Tuning
# Enable lazy queues by default for all queues if memory is tight
# queue_index_embed_msgs_below = 4096

# Logs
log.console = true
log.console.level = warning
log.file.level = info
log.exchange = true
log.exchange.level = warning
