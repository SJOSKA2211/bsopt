[databases]
bsopt = postgresql://${POSTGRES_USER:?PostgreSQL user is not set}:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@timescaledb:5432/${POSTGRES_DB:?PostgreSQL DB name is not set}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = ${PGBOUNCER_MAX_CLIENT_CONN:-100}
default_pool_size = ${PGBOUNCER_POOL_SIZE:-5}
reserve_pool_size = ${PGBOUNCER_RESERVE_POOL_SIZE:-2}
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
server_idle_timeout = 60
server_checkout_timeout = 60
log_statement = none # Set to 'all' for debugging
stats_period = 60
admin_users = postgres # Assuming 'postgres' is a user that can access pgbouncer admin commands
EOF

[admins]
postgres = admin # Example admin user, password should be set securely

# Dummy userlist.txt to satisfy auth_file requirement if not using other auth methods
# In a real scenario, this would map users to hashed passwords or other auth methods.
# For simplicity, we'll rely on the DATABASE_URL for primary connection.
# This is a placeholder; actual user authentication for pgbouncer itself needs setup.
userlist.txt =
postgres = "" # Passwordless for example, should be hashed
