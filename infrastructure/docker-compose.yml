# ==============================================================================
# Manifold: UNIFIED PRODUCTION ORCHESTRATION (v12.0)
# ==============================================================================
version: '3.9'

networks:
  frontend_net:
    driver: bridge
    internal: false
  backend_net:
    driver: bridge
    internal: true
  data_net:
    driver: bridge
    internal: true
  ml_net:
    driver: bridge
    internal: true

volumes:
  timescale_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  shared_utils:
    driver: local

services:
  # --- INFRASTRUCTURE LAYER ---
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: manifold-db
    networks:
      - data_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init-scripts/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    shm_size: 1gb
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: manifold-pgbouncer
    networks:
      - data_net
      - backend_net
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}"
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_POOL_MODE: transaction
    depends_on:
      timescaledb:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: manifold-redis
    networks:
      - data_net
      - backend_net
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: manifold-mq
    networks:
      - data_net
      - backend_net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${POSTGRES_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- CORE SERVICES LAYER ---
  auth_service:
    build:
      context: ..
      dockerfile: infrastructure/orchestration/Dockerfile.auth
    container_name: manifold-auth
    networks:
      - backend_net
      - data_net
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=timescaledb
      - RABBITMQ_HOST=rabbitmq
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@pgbouncer:6432/bsopt
    env_file: ../.env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_service:
    build:
      context: ..
      dockerfile: infrastructure/orchestration/Dockerfile.api
    container_name: manifold-api
    networks:
      - frontend_net
      - backend_net
      - data_net
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=timescaledb
      - RABBITMQ_HOST=rabbitmq
      - PGBOUNCER_HOST=pgbouncer
      - DATABASE_URL=postgresql+asyncpg://admin:${POSTGRES_PASSWORD}@pgbouncer:6432/bsopt
    env_file: ../.env
    depends_on:
      auth_service:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: infrastructure/orchestration/Dockerfile.worker
    container_name: manifold-worker
    networks:
      - backend_net
      - ml_net
      - data_net
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=timescaledb
      - RABBITMQ_HOST=rabbitmq
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@pgbouncer:6432/bsopt
    env_file: ../.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  mlops:
    build:
      context: ..
      dockerfile: infrastructure/orchestration/Dockerfile.mlops
    container_name: manifold-mlops
    networks:
      - ml_net
      - backend_net
    env_file: ../.env
    depends_on:
      - worker

  # --- EDGE LAYER ---
  frontend:
    build:
      context: ..
      dockerfile: infrastructure/orchestration/Dockerfile.frontend
    container_name: manifold-frontend
    networks:
      - frontend_net
    depends_on:
      api_service:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: manifold-edge
    networks:
      - frontend_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - shared_utils:/opt/manifold/utils:ro
    depends_on:
      frontend:
        condition: service_healthy
      api_service:
        condition: service_healthy
