# ==
# BS-OPT: OMARCHY META-COGNITIVE ORCHESTRATION (v12.0)
# ==
version: '3.9'

# --- Networks ---
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  data_net:
    driver: bridge
  ml_net:
    driver: bridge

# --- Volumes ---
volumes:
  timescaledb_data:
  redis_data:
  rabbitmq_data:
  pki_data:

# --- Services ---
services:
  # --- 1. Data Persistence Layer ---
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: manifold-db
    networks:
      - data_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?PostgreSQL user is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL password is not set}
      POSTGRES_DB: ${POSTGRES_DB:?PostgreSQL DB name is not set}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: manifold-redis
    networks:
      - data_net
      - backend_net
    command: redis-server --requirepass ${REDIS_PASSWORD:?Redis password is not set} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: manifold-mq
    networks:
      - data_net
      - backend_net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RabbitMQ user is not set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RabbitMQ password is not set}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: manifold-pgbouncer
    networks:
      - data_net
      - backend_net
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?PostgreSQL user is not set}:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@timescaledb:5432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_POOL_MODE: transaction
    depends_on:
      timescaledb:
        condition: service_healthy

  # --- 2. Core Services Layer ---
  auth_service:
    build:
      context: ./infrastructure/orchestration
      dockerfile: Dockerfile.auth
    container_name: manifold-auth
    networks:
      - backend_net
      - data_net
    environment:
      AUTH_SVC_ADDR: "auth_service:50051"
      JWT_SECRET: ${JWT_SECRET:?JWT secret is not set}
      JWT_ALGORITHM: "RS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA encryption key is not set}
      REDIS_HOST: redis
      POSTGRES_HOST: timescaledb
      RABBITMQ_HOST: rabbitmq
      DATABASE_URL: "postgresql+asyncpg://manifold_admin:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@pgbouncer:6432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
    volumes:
      - ./.pki:/etc/ssl/certs:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=auth_service:50051"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  api_service:
    build:
      context: ./infrastructure/orchestration
      dockerfile: Dockerfile.api
    container_name: manifold-api
    networks:
      - frontend_net
      - backend_net
      - data_net
    environment:
      AUTH_SVC_ADDR: "auth_service:50051"
      REDIS_HOST: redis
      POSTGRES_HOST: timescaledb
      RABBITMQ_HOST: rabbitmq
      PGBOUNCER_HOST: pgbouncer
      DATABASE_URL: "postgresql+asyncpg://manifold_admin:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@pgbouncer:6432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
    volumes:
      - ./.pki:/etc/ssl/certs:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  worker:
    build:
      context: ./infrastructure/orchestration
      dockerfile: Dockerfile.worker
    container_name: manifold-worker
    networks:
      - backend_net
      - ml_net
      - data_net
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: timescaledb
      RABBITMQ_HOST: rabbitmq
      DATABASE_URL: "postgresql+asyncpg://manifold_admin:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@pgbouncer:6432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
    volumes:
      - ./.pki:/etc/ssl/certs:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  mlops:
    build:
      context: ./infrastructure/orchestration
      dockerfile: Dockerfile.mlops
    container_name: manifold-mlops
    networks:
      - ml_net
      - backend_net
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: timescaledb
    volumes:
      - ./.pki:/etc/ssl/certs:ro
    depends_on:
      worker:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # --- 3. Frontend Layer ---
  frontend:
    build:
      context: ./infrastructure/orchestration
      dockerfile: Dockerfile.frontend
    container_name: manifold-frontend
    networks:
      - frontend_net
    environment:
      VITE_API_URL: "http://localhost:8000"
      VITE_AUTH_GRPC_URL: "auth_service:50051"
    depends_on:
      api_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 4. Edge Layer ---
  nginx:
    image: nginx:alpine
    container_name: manifold-edge
    networks:
      - frontend_net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      api_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
