# ==============================================================================
# BS-OPT: THE HIGH-PERFORMANCE HELM VALUES (v2.0)
# ==============================================================================
# *
# Standardizing on unified images and optimized resources.
# ==============================================================================

# Global settings
global:
  environment: production
  domain: bsopt.local

# Default settings for all src
defaults:
  replicaCount: 2
  image:
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Service-specific overrides
api:
  enabled: true
  image:
    repository: bsopt/api
  service:
    port: 80
    targetPort: 8000

worker:
  enabled: true
  image:
    repository: bsopt/worker
  replicaCount: 3

scraper:
  enabled: true
  image:
    repository: bsopt/scraper

auth:
  enabled: true
  image:
    repository: bsopt/auth-service
  service:
    port: 3001

frontend:
  enabled: true
  image:
    repository: bsopt/frontend
  service:
    port: 80
    targetPort: 80

neuralPricing:
  enabled: true
  image:
    repository: bsopt/neural-pricing
  replicaCount: 2
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

# Infrastructure pointers
externalServices:
  postgres:
    host: postgres-master
    port: 5432
  redis:
    host: redis-master
    port: 6379
  rabbitmq:
    host: rabbitmq-cluster
    port: 5672
