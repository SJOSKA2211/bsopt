{{- range $serviceName, $config := .Values }}
{{- if and (kindIs "map" $config) (hasKey $config "enabled") $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $serviceName }}
  labels:
    app: {{ $.Release.Name }}-{{ $serviceName }}
spec:
  replicas: {{ $config.replicaCount | default $.Values.defaults.replicaCount }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $serviceName }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $serviceName }}
    spec:
      containers:
        - name: {{ $serviceName }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag | default $.Values.defaults.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy | default $.Values.defaults.image.pullPolicy }}
          {{- if $config.service }}
          ports:
            - containerPort: {{ $config.service.targetPort | default 8000 }}
          {{- end }}
          resources:
            {{- toYaml ($config.resources | default $.Values.defaults.resources) | nindent 12 }}
          env:
            - name: ENVIRONMENT
              value: {{ $.Values.global.environment | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: DATABASE_URL
            {{- if $config.env }}
            {{- range $key, $val := $config.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
          {{- if $config.healthcheck }}
          livenessProbe:
            {{- toYaml $config.healthcheck | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
