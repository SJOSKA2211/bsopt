# infrastructure/envoy/envoy.yaml
static_resources:
  listeners:
  - name: listener_edge
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: equaflow_routes
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/auth" }
                route: { cluster: auth_service }
              - match: { prefix: "/api" }
                route: { cluster: api_service }
              - match: { prefix: "/ml" }
                route: { cluster: ml_service }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  
  clusters:
  - name: auth_service
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: auth_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: auth_service, port_value: 8000 }
  - name: api_service
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: api_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: api_service, port_value: 8001 }
  - name: ml_service
    connect_timeout: 0.25s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: ml_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: ml_service, port_value: 8002 }

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
