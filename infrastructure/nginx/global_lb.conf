# EquaFlow Global Load Balancer Configuration (Nginx)
# Region-aware routing with healthcheck-based failover.

upstream equaflow_nyc {
    server nyc-api-1.equaflow.io:8080 max_fails=3 fail_timeout=30s;
    server nyc-api-2.equaflow.io:8080 backup;
}

upstream equaflow_ldn {
    server ldn-api-1.equaflow.io:8080 max_fails=3 fail_timeout=30s;
}

upstream equaflow_tyo {
    server tyo-api-1.equaflow.io:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 443 ssl http2;
    server_name api.equaflow.io;

    # Institutional SSL & Hardening
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Region-aware routing based on client IP (requires GeoIP module)
    location / {
        proxy_pass http://equaflow_nyc; # Default to NYC
        proxy_set_header X-Request-Id $uuid;
        proxy_set_header X-API-Version "v1";
        add_header X-Region "NYC";
    }

    location /health {
        access_log off;
        return 200 'OK';
    }
}
