# Manifold Global Load Balancer Configuration (Nginx)
# Region-aware routing with healthcheck-based failover.

upstream Manifold_nyc {
    server nyc-api-1.Manifold.io:8080 max_fails=3 fail_timeout=30s;
    server nyc-api-2.Manifold.io:8080 backup;
}

upstream Manifold_ldn {
    server ldn-api-1.Manifold.io:8080 max_fails=3 fail_timeout=30s;
}

upstream Manifold_tyo {
    server tyo-api-1.Manifold.io:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 443 ssl http2;
    server_name api.Manifold.io;

    # Production SSL & Hardening
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Region-aware routing based on client IP (requires GeoIP module)
    location / {
        proxy_pass http://Manifold_nyc; # Default to NYC
        proxy_set_header X-Request-Id $uuid;
        proxy_set_header X-API-Version "v1";
        add_header X-Region "NYC";
    }

    location /health {
        access_log off;
        return 200 'OK';
    }
}
