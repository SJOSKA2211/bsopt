# ==
# Manifold: LOKI CONFIGURATION (v2.0)
# ==
# Grafana Loki configuration for log aggregation
# Supports high-throughput ingestion with retention policies
# ==

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  http_server_read_timeout: 30s
  http_server_write_timeout: 30s
  http_server_idle_timeout: 120s

server_registered_paths:
  - /metrics

# ==
# Ingester Configuration
# ==
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
    min_ready_duration: 0s
  
  # Chunk lifecycle
  chunk_idle_period: 5m
  chunk_retain_period: 15m
  max_chunk_age: 1h
  
  # Flush settings
  flush_check_period: 10s
  flush_op_timeout: 1m
  
  # WAL (Write-Ahead Log)
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true
    replay_memory_ceiling: 4GB

# ==
# Schema Configuration
# ==
schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
      chunks:
        period: 1h
        prefix: chunks_

# ==
# Storage Configuration
# ==
storage_config:
  boltdb:
    directory: /loki/index
  
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    cache_ttl: 24h
  
  filesystem:
    directory: /loki/chunks

# ==
# Limits Configuration
# ==
limits_config:
  # Reject old samples
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  
  # Ingestion limits
  ingestion_rate_mb: 50
  ingestion_burst_size_mb: 100
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 30
  
  # Query limits
  query_timeout: 3m
  max_entries_limit_per_query: 5000
  max_line_length: 256KB
  
  # Sharding
  shard_streams:
    enabled: true
    logging_enabled: true

# ==
# Compactor Configuration
# ==
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_worker_count: 150

# ==
# Ruler Configuration (Alerting)
# ==
ruler:
  enabled: true
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules
  evaluation_interval: 1m
  poll_interval: 1m
  alertmanager_refresh_interval: 1m

# ==
# Distributor Configuration
# ==
distributor:
  rate_limit: 100MB
  burst_size_bytes: 1GB

# ==
# Querier Configuration
# ==
querier:
  query_timeout: 2m
  max_concurrent: 20
  per_query_timeout: 2m

# ==
# Query Frontend Configuration
# ==
query_scheduler:
  max_outstanding_requests_per_tenant: 100

frontend:
  compress_responses: true
  log_queries_longer_than: 5s

# ==
# Worker Configuration
# ==
query_range:
  align_queries_with_step: true
  cache_results: true
  max_retries: 5
  results_cache:
    cache:
      enable_fifocache: true
      fifocache:
        size: 2048
        validity: 1h

# ==
# Table Manager (Legacy)
# ==
table_manager:
  retention_deletes_enabled: true
  retention_period: 672h
  poll_interval: 0s
