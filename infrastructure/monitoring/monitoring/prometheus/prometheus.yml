global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording_rules.yml

scrape_configs:
  
  - job_name: 'manifold-hot-path'
    scrape_interval: 5s
    static_configs:
      - targets: ['api:8000', 'neural-pricing:8000', 'ml-inference:5001']
    metrics_path: /metrics

  # --- Core API & Pricing Services ---
  - job_name: 'bsopt-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
    metrics_path: /metrics

  - job_name: 'bsopt-neural-pricing'
    static_configs:
      - targets: ['neural-pricing:8000']
        labels:
          service: 'neural-pricing'
    metrics_path: /metrics

  - job_name: 'bsopt-ml-inference'
    static_configs:
      - targets: ['ml-inference:5001']
        labels:
          service: 'ml-inference'
    metrics_path: /metrics

  # --- Data Ingestion ---
  - job_name: 'bsopt-scraper'
    static_configs:
      - targets: ['scraper:8000']
        labels:
          service: 'scraper'
    metrics_path: /metrics

  # --- Ray ML Cluster ---
  - job_name: 'ray-cluster'
    static_configs:
      - targets: ['ray-head:8080', 'ray-worker-1:8080', 'rl-training-worker:8080']
        labels:
          cluster: 'bsopt-ray'

  # --- Infrastructure ---
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # --- Pushgateway (for batch jobs) ---
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # --- Prometheus self-monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- Edge Proxy ---
  - job_name: 'envoy'
    static_configs:
      - targets: ['envoy:9901']
    metrics_path: /stats/prometheus

  # --- Telemetry Infrastructure ---
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889', 'otel-collector:13133']
