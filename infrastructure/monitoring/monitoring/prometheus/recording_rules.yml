groups:
  - name: bsopt_latency_rules
    rules:
      - record: job:pricing_latency:p99
        expr: histogram_quantile(0.99, sum(rate(pricing_service_duration_seconds_bucket[5m])) by (le, method, service))
      
      - record: job:ingestion_latency:p99
        expr: histogram_quantile(0.99, sum(rate(bsopt_ingestion_batch_duration_seconds_bucket[5m])) by (le, table, service))

  - name: bsopt_throughput_rules
    rules:
      - record: job:api_requests:rate5m
        expr: sum(rate(http_requests_total[5m])) by (service, status)
