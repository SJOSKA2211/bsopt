apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bsopt-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/SJOSKA2211/bsopt.git'
    targetRevision: HEAD
    path: infrastructure/helm/bsopt
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bsopt-blue # Initial deployment color
  syncPolicy:
    automated:
      prune: true
      selfHeal: true