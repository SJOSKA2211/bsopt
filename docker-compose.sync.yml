services:
  postgres-sync:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: bsopt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bsopt_secret}
    ports:
      - "5433:5432"
    networks:
      - sync-network

  redis-sync:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-bsopt_redis_secret}
    ports:
      - "6380:6379"
    networks:
      - sync-network

  auth-service-sync:
    image: bsopt-auth-service-dev
    ports:
      - "3002:3001"
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-bsopt_secret}@postgres-sync:5432/bsopt
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-secret}
      - BETTER_AUTH_URL=http://localhost:3002
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis-sync:6379/0
    volumes:
      - ./src/auth-service:/app
      - /app/node_modules
    networks:
      - sync-network
    depends_on:
      - postgres-sync
      - redis-sync

  api-sync:
    image: bsopt-api-dev
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:-bsopt_secret}@postgres-sync:5432/bsopt
      - REDIS_HOST=redis-sync
      - REDIS_PORT=6379
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis-sync:6379/0
    volumes:
      - ./src:/app/src
    networks:
      - sync-network
    depends_on:
      - postgres-sync
      - redis-sync

  app-gateway-sync:
    image: bsopt-app-gateway-dev
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - LOG_LEVEL=debug
      - API_URL=http://api-sync:8000/graphql
    volumes:
      - ./src/gateway:/app
      - /app/node_modules
    networks:
      - sync-network
    depends_on:
      - api-sync

networks:
  sync-network:
    driver: bridge
