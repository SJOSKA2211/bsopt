version: "2"
type: backend
tech_stack:
  - Python 3.12
  - FastAPI
  - PostgreSQL (TimescaleDB)
  - Redis
  - Celery + RabbitMQ
  - Strawberry GraphQL
  - Numba JIT
  - gRPC (protobuf)
  - Prometheus
  - structlog
features:
  - name: Health Check
    description: API liveness and health check endpoint
    files:
      - src/api/main.py
    endpoints:
      - method: GET
        path: /health
        description: Returns API health status
        auth_required: false
        response_schema:
          "200": '{"status": "healthy"}'
    depends_on: []

  - name: Root Info
    description: API root info endpoint
    files:
      - src/api/main.py
    endpoints:
      - method: GET
        path: /
        description: Returns API info
        auth_required: false
        response_schema:
          "200": '{"message": "BS-Opt Optimized API"}'
    depends_on: []

  - name: Authentication
    description: User authentication with email/password, OAuth2 (Google/GitHub), JWT RS256, token refresh, and logout
    files:
      - src/api/routes/auth.py
      - src/auth/models.py
    endpoints:
      - method: POST
        path: /api/v1/auth/register
        description: Register a new user with email and password
        auth_required: false
        request_schema:
          body:
            email: string
            password: string
            full_name: string
        response_schema:
          "201": User object with JWT token
          "400": Validation error
          "409": Email already registered
      - method: POST
        path: /api/v1/auth/login
        description: Login with email and password, returns JWT tokens
        auth_required: false
        request_schema:
          body:
            email: string
            password: string
        response_schema:
          "200": '{"access_token": "...", "token_type": "bearer"}'
          "401": Invalid credentials
      - method: POST
        path: /api/v1/auth/logout
        description: Logout and invalidate session
        auth_required: true
        response_schema:
          "200": Success
      - method: POST
        path: /api/v1/auth/refresh
        description: Refresh JWT access token
        auth_required: false
        request_schema:
          body:
            refresh_token: string
        response_schema:
          "200": New access token
          "401": Invalid or expired refresh token
      - method: GET
        path: /api/v1/auth/me
        description: Get current authenticated user profile
        auth_required: true
        response_schema:
          "200": User profile object
          "401": Unauthorized
    depends_on: []

  - name: Options Pricing
    description: Financial options pricing using Black-Scholes, Heston FFT, and LSM models
    files:
      - src/api/routes/pricing.py
      - src/pricing/black_scholes.py
      - src/pricing/heston.py
    endpoints:
      - method: POST
        path: /api/v1/pricing/calculate
        description: Calculate option price using specified model
        auth_required: true
        request_schema:
          body:
            s: number (spot price)
            k: number (strike price)
            t: number (time to expiry in years)
            r: number (risk-free rate)
            sigma: number (volatility)
            option_type: string (call/put)
            model: string (black_scholes/heston/lsm)
        response_schema:
          "200": '{"price": number, "greeks": {...}}'
          "422": Validation error
      - method: GET
        path: /api/v1/pricing/models
        description: List available pricing models
        auth_required: false
        response_schema:
          "200": List of pricing model names
    depends_on:
      - Authentication

  - name: Options Chain
    description: Options chain data retrieval and analysis
    files:
      - src/api/routes/options.py
    endpoints:
      - method: GET
        path: /api/v1/options/chain
        description: Get options chain for a given underlying
        auth_required: true
        request_schema:
          query:
            symbol: string
            expiry: string (date)
        response_schema:
          "200": Options chain data
          "404": Symbol not found
    depends_on:
      - Authentication

  - name: Portfolio Management
    description: CRUD operations for user portfolio
    files:
      - src/api/routes/portfolio.py
      - src/portfolio/models.py
    endpoints:
      - method: GET
        path: /api/v1/portfolio
        description: Get user portfolio
        auth_required: true
        response_schema:
          "200": Portfolio object
          "401": Unauthorized
      - method: POST
        path: /api/v1/portfolio/positions
        description: Add a new position to portfolio
        auth_required: true
        request_schema:
          body:
            symbol: string
            quantity: number
            entry_price: number
        response_schema:
          "201": Created position
          "422": Validation error
      - method: DELETE
        path: /api/v1/portfolio/positions/{id}
        description: Remove a position from portfolio
        auth_required: true
        response_schema:
          "200": Success
          "404": Position not found
    depends_on:
      - Authentication

  - name: User Management
    description: User profile management
    files:
      - src/api/routes/users.py
    endpoints:
      - method: GET
        path: /api/v1/users/me
        description: Get current user details
        auth_required: true
        response_schema:
          "200": User object
          "401": Unauthorized
      - method: PATCH
        path: /api/v1/users/me
        description: Update current user profile
        auth_required: true
        request_schema:
          body:
            full_name: string
        response_schema:
          "200": Updated user object
    depends_on:
      - Authentication

  - name: ML Trading Signals
    description: ML-based trading signal inference using Transformer RL models
    files:
      - src/api/routes/ml.py
      - src/ml/inference.py
    endpoints:
      - method: POST
        path: /api/v1/ml/predict
        description: Get ML trading signal prediction
        auth_required: true
        request_schema:
          body:
            symbol: string
            features: object
        response_schema:
          "200": Prediction object with confidence score
    depends_on:
      - Authentication

  - name: GraphQL API
    description: GraphQL endpoint for flexible querying
    files:
      - src/api/graphql/schema.py
      - src/api/main.py
    endpoints:
      - method: POST
        path: /graphql
        description: GraphQL queries and mutations
        auth_required: false
        response_schema:
          "200": GraphQL response
    depends_on:
      - Authentication

  - name: Metrics
    description: Prometheus metrics endpoint for observability
    files:
      - src/api/main.py
    endpoints:
      - method: GET
        path: /metrics
        description: Prometheus metrics
        auth_required: false
        response_schema:
          "200": Prometheus metrics in text format
    depends_on: []

known_limitations:
  - issue: Auth service is a separate Node.js service (better-auth) on port 3001
    location: src/auth-service/
    impact: JWT tokens may need to be validated against auth-service
  - issue: Some endpoints may require database migrations to be run first
    location: src/migrations/
    impact: Database-dependent endpoints may fail if migrations haven't run
