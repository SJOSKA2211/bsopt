project_name: bsopt
description: "Advanced financial derivatives pricing, risk management, and autonomous trading platform"
tech_stacks:
  backend:
    - Python 3.12
    - FastAPI (uvicorn)
    - SQLAlchemy / PostgreSQL (TimescaleDB)
    - Redis (caching, pub/sub)
    - Celery + RabbitMQ (task queue)
    - Strawberry GraphQL
    - Numba JIT / FFT (pricing kernels)
    - gRPC (protobuf)
    - Prometheus metrics
    - structlog
  frontend:
    - TypeScript
    - React 19
    - Vite (rolldown-vite)
    - MUI (Material UI v7)
    - TanStack Query
    - ECharts / lightweight-charts
    - Three.js / React Three Fiber
    - better-auth (client)
    - WebSockets
    - WebAssembly (WASM SIMD pricing)
  auth_service:
    - Node.js
    - better-auth
    - PostgreSQL
  infrastructure:
    - Docker / Docker Compose
    - TimescaleDB (PostgreSQL 16)
    - Redis 7
    - RabbitMQ 3
features:
  - User authentication (OAuth2 Google/GitHub, email/password, RS256 JWT)
  - Financial derivatives pricing (Black-Scholes, Heston FFT, LSM)
  - Options chain analysis
  - Portfolio management
  - ML-based trading signals (Transformer RL)
  - Real-time streaming via WebSockets
  - GraphQL API gateway
  - Audit logging
  - Chaos engineering / AIOps self-healing
  - Prometheus metrics / Grafana monitoring
  - WASM SIMD in-browser pricing
api_endpoints:
  - GET /health
  - GET /
  - GET /metrics
  - /api/v1/auth (login, register, OAuth2, token refresh)
  - /api/v1/pricing (option pricing calculation)
  - /api/v1/options (options chain data)
  - /api/v1/portfolio (portfolio CRUD)
  - /api/v1/users (user management)
  - /api/v1/ml (ML model inference)
  - /graphql (GraphQL endpoint)
  - /api/v1/debug (debug utilities)
services:
  api:
    port: 8000
    status: running
  auth-service:
    port: 3001
    status: running
  postgres:
    port: 5433
    status: healthy
  redis:
    port: 6379
    status: healthy
  rabbitmq:
    port: 5672
    management_port: 15672
    status: healthy
