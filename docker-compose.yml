version: "3.9"

services:
  # Database Services
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set. Ensure POSTGRES_DB is provided in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set. Ensure POSTGRES_USER is provided in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Ensure POSTGRES_PASSWORD is provided in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    environment:
      # Use REDIS_PASSWORD from .env for Redis server authentication
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Ensure REDIS_PASSWORD is provided in .env}"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set.}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # RabbitMQ user/pass are managed by the bootstrap script via RABBITMQ_URL
      # Ensure RABBITMQ_URL is correctly formatted in .env
      # Example: RABBITMQ_URL=amqp://guest:mysecretpassword@localhost:5672//
      # For direct password auth if needed by the service:
      # RABBITMQ_DEFAULT_USER=guest
      # RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is not set.}
      # For now, relying on bootstrap script setting RABBITMQ_URL and using guest user/pass
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service (gRPC + HTTP Health)
  auth_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_api_server
    environment:
      - GRPC_SECURE=false # Set to true in production with real certs
      # Use strict syntax for all required environment variables
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Ensure REDIS_PASSWORD is provided in .env}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is not set.}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set.}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set.}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set. Ensure JWT_SECRET is provided in .env}
      - JWT_ALGORITHM=${JWT_ALGORITHM:?JWT_ALGORITHM is not set.}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is not set.}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:?REFRESH_TOKEN_EXPIRE_DAYS is not set.}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is not set.}
      # Add other necessary env vars like RABBITMQ_URL if auth_api uses it
    ports:
      - "50051:50051"
      - "3001:3001"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq: # Added RabbitMQ dependency as auth might use async tasks
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: ["python", "src/auth/grpc_server.py"]

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Ensure REDIS_PASSWORD is provided in .env}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER is not set.}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set.}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set.}
      - CELERY_BROKER_URL=${RABBITMQ_URL:?RABBITMQ_URL is not set. Ensure RABBITMQ_URL is provided in .env} # Use URL from bootstrap script
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set.}
      - JWT_ALGORITHM=${JWT_ALGORITHM:?JWT_ALGORITHM is not set.}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is not set.}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:?REFRESH_TOKEN_EXPIRE_DAYS is not set.}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is not set.}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["celery", "-A", "src.workers.tasks.celery_app", "worker", "--loglevel=info"]

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    networks:
      - app-network
    volumes:
      - mlflow_data:/mlruns
    # Add healthcheck for MLflow
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: mlflow server --host 0.0.0.0 --port 5000

volumes:
  postgres_data:
  redis_data:
  mlflow_data:

networks:
  app-network:
    driver: bridge
