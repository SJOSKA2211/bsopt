version: '3.9'

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge

volumes:
  timescaledb_data:
  redis_data:
  rabbitmq_data:

services:
  # --- 1. Data Persistence Layer ---
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: bsopt-manifold-db
    networks:
      - internal_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?PostgreSQL user is missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL password is missing}
      POSTGRES_DB: ${POSTGRES_DB:?PostgreSQL DB name is missing}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bsopt-manifold-redis
    networks:
      - internal_net
    command: redis-server --requirepass ${REDIS_PASSWORD:?Redis password is missing} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bsopt-manifold-mq
    networks:
      - internal_net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RabbitMQ user is missing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RabbitMQ password is missing}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bsopt-manifold-pgbouncer
    networks:
      - internal_net
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}"
      PGBOUNCER_MAX_CLIENT_CONN: 1000
    depends_on:
      timescaledb: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. Core Services Layer ---
  auth_service:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.auth
    container_name: bsopt-manifold-auth
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT secret is missing}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}"
    volumes:
      - ./.pki:/etc/ssl/certs:ro
    depends_on:
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_service:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.api
    container_name: bsopt-manifold-api
    networks:
      - public_net
      - internal_net
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      AUTH_SVC_ADDR: "auth_service:50051"
      JWT_SECRET: ${JWT_SECRET:?JWT secret is missing}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}"
    volumes:
      - ./.pki:/etc/ssl/certs:ro
    depends_on:
      auth_service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.worker
    container_name: bsopt-manifold-worker
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }

  mlops:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.mlops
    container_name: bsopt-manifold-mlops
    networks:
      - internal_net
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}"
    depends_on:
      worker: { condition: service_started }

  frontend:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.frontend
    container_name: bsopt-manifold-frontend
    networks:
      - public_net
    environment:
      VITE_API_URL: "http://localhost:8000/api/v1"
    depends_on:
      api_service: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    container_name: bsopt-manifold-edge
    networks:
      - public_net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_service: { condition: service_healthy }
      frontend: { condition: service_started }
