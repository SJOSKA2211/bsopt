version: '3.8'

services:
  # === Database Service ===
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bsopt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bsopt}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bsopt-net

  # === Cache Service ===
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - bsopt-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === API Service ===
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-dev
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./tests:/app/tests
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bsopt}
      - REDIS_URL=redis://redis:6379/0
      - INSIDE_DOCKER=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsopt-net
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # === Worker Service ===
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-dev
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bsopt}
      - REDIS_URL=redis://redis:6379/0
      - INSIDE_DOCKER=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsopt-net
    command: celery -A src.worker.app worker --loglevel=info

  # === Auth Service (Node.js) ===
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth-service-dev
    volumes:
      - ./src/auth-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bsopt}
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bsopt-net
    command: npm run dev

networks:
  bsopt-net:
    driver: bridge

volumes:
  pgdata:
