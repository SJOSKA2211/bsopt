# ==
# BS-OPT: Production Docker Compose Configuration (v12.1 - Hardened INFRA_KERNEL)
# ==

version: '3.9'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  data_net:
    driver: bridge
  ml_net:
    driver: bridge

volumes:
  timescaledb_data:
  redis_data:
  rabbitmq_data:

services:
  # --- 1. Data Persistence Layer ---
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: bsopt-manifold-db
    networks:
      - data_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?PostgreSQL user is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL password is not set}
      POSTGRES_DB: ${POSTGRES_DB:?PostgreSQL DB name is not set}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: bsopt-manifold-redis
    networks:
      - data_net
      - backend_net
    command: redis-server --requirepass ${REDIS_PASSWORD:?Redis password is not set} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bsopt-manifold-mq
    networks:
      - data_net
      - backend_net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RabbitMQ user is not set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RabbitMQ password is not set}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bsopt-manifold-pgbouncer
    networks:
      - data_net
      - backend_net
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:?PostgreSQL user is not set}:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@timescaledb:5432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_PORT: 6432
      LISTEN_PORT: 6432
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # --- 2. Core Services Layer ---
  auth_service:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.auth
    container_name: bsopt-manifold-auth
    networks:
      - backend_net
      - data_net
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT secret is not set}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Redis password is not set}@redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?PostgreSQL user is not set}:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@pgbouncer:6432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
    volumes:
      - ./.pki:/etc/ssl/certs:ro
      - ./.pki:/etc/ssl/private:ro
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"] # Fallback if grpc_health_probe missing
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  api_service:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.api
    container_name: bsopt-manifold-api
    networks:
      - frontend_net
      - backend_net
      - data_net
    environment:
      AUTH_SVC_ADDR: "auth_service:50051"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Redis password is not set}@redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?PostgreSQL user is not set}:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@pgbouncer:6432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
      JWT_SECRET: ${JWT_SECRET:?JWT secret is not set}
    volumes:
      - ./.pki:/etc/ssl/certs:ro
      - ./.pki:/etc/ssl/private:ro
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      auth_service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  worker:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.worker
    container_name: bsopt-manifold-worker
    networks:
      - backend_net
      - ml_net
      - data_net
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Redis password is not set}@redis:6379/0"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:?RabbitMQ user is not set}:${RABBITMQ_PASSWORD:?RabbitMQ password is not set}@rabbitmq:5672//"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?PostgreSQL user is not set}:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@pgbouncer:6432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  mlops:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.mlops
    container_name: bsopt-manifold-mlops
    networks:
      - ml_net
      - backend_net
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Redis password is not set}@redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:?PostgreSQL user is not set}:${POSTGRES_PASSWORD:?PostgreSQL password is not set}@pgbouncer:6432/${POSTGRES_DB:?PostgreSQL DB name is not set}"
    depends_on:
      worker: { condition: service_healthy }
      auth_service: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  frontend:
    build:
      context: .
      dockerfile: infrastructure/orchestration/Dockerfile.frontend
    container_name: bsopt-manifold-frontend
    networks:
      - frontend_net
    environment:
      VITE_API_URL: "http://api_service:8000"
    depends_on:
      api_service: { condition: service_healthy }

  nginx:
    image: nginx:alpine
    container_name: bsopt-manifold-edge
    networks:
      - frontend_net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend: { condition: service_healthy }
      api_service: { condition: service_healthy }
