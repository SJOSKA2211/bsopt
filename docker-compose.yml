services:
  # --- INFRASTRUCTURE LAYER ---
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: bsopt_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - back-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: bsopt_cache
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD missing}
    networks:
      - back-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD missing}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bsopt_broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER missing}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD missing}
    networks:
      - back-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- CORE SERVICES LAYER ---

  auth_api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: "api,auth,shared,observability"
    container_name: bsopt_auth_api
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT missing}
      - IS_AUTH_SERVICE=true
      - REDIS_URL=${REDIS_URL:?REDIS_URL missing}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL missing}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL missing}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET missing}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY missing}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY missing}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY missing}
      - VAULT_ADDR=${VAULT_ADDR:?VAULT_ADDR missing}
      - VAULT_TOKEN=${VAULT_TOKEN:?VAULT_TOKEN missing}
      - GRPC_SECURE=${GRPC_SECURE:?GRPC_SECURE missing}
      - GRPC_CA_CERT=${GRPC_CA_CERT:?GRPC_CA_CERT missing}
      - GRPC_SERVER_CERT=${GRPC_SERVER_CERT:?GRPC_SERVER_CERT missing}
      - GRPC_SERVER_KEY=${GRPC_SERVER_KEY:?GRPC_SERVER_KEY missing}
    volumes:
      - ./.pki:/etc/pki:ro
    networks:
      - back-network
      - grpc-network
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "3001:3001"
      - "50051:50051"
    command: ["python", "api/auth_index.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  pricing_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bsopt_pricing_api
    environment:
      - ENVIRONMENT=${ENVIRONMENT:?ENVIRONMENT missing}
      - REDIS_URL=${REDIS_URL:?REDIS_URL missing}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL missing}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL missing}
      - AUTH_SERVICE_GRPC_URL=${AUTH_SERVICE_GRPC_URL:?AUTH_SERVICE_GRPC_URL missing}
      - GRPC_SECURE=${GRPC_SECURE:?GRPC_SECURE missing}
      - GRPC_CA_CERT=${GRPC_CA_CERT:?GRPC_CA_CERT missing}
      - GRPC_CLIENT_CERT=${GRPC_CLIENT_CERT:?GRPC_CLIENT_CERT missing}
      - GRPC_CLIENT_KEY=${GRPC_CLIENT_KEY:?GRPC_CLIENT_KEY missing}
      - OPA_URL=${OPA_URL:?OPA_URL missing}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:?TRUSTED_PROXIES missing}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS missing}
      - MARKET_TICKER_SYMBOLS=${MARKET_TICKER_SYMBOLS:?MARKET_TICKER_SYMBOLS missing}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:?MINIO_ENDPOINT missing}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER missing}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing}
      - NSE_SYMBOLS=${NSE_SYMBOLS:?NSE_SYMBOLS missing}
      - NSE_SCRAPER_SECTORS=${NSE_SCRAPER_SECTORS:?NSE_SCRAPER_SECTORS missing}
    volumes:
      - ./.pki:/etc/pki:ro
    networks:
      - back-network
      - grpc-network
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth_api: { condition: service_healthy }
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.index:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "uvloop"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  math_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: "shared,observability,ml,quant,distributed"
    container_name: bsopt_math_worker
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:?CELERY_BROKER_URL missing}
      - REDIS_URL=${REDIS_URL:?REDIS_URL missing}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL missing}
    networks:
      - back-network
      - grpc-network
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      pricing_api: { condition: service_healthy }
    command: ["celery", "-A", "src.workers.math_worker.app", "worker", "--loglevel=info", "-P", "solo"]

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: bsopt_frontend
    networks:
      - front-network
      - back-network
    depends_on:
      pricing_api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:stable-alpine
    container_name: bsopt_gateway
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - front-network
      - back-network
    depends_on:
      frontend: { condition: service_healthy }
      pricing_api: { condition: service_healthy }


volumes:
  postgres_data:
  redis_data:


networks:
  front-network:
    driver: bridge
  back-network:
    internal: true
    driver: bridge
  grpc-network:
    internal: true
    driver: bridge