name: bsopt

services:
  # === Database Service ===
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf' -c 'hba_file=/etc/postgresql/pg_hba.conf'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bsopt}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./src/migrations:/migrations:ro
      - ./docker/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:rw
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bsopt-network

  # === Connection Pooler ===
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      AUTH_TYPE: scram-sha-256
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      MAX_PREPARED_STATEMENTS: 100
      ADMIN_USERS: ${POSTGRES_USER}
      STATS_PERIOD: 60
    ports:
      - "127.0.0.1:6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsopt-network

  # === Cache Service ===
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-bsopt_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bsopt_redis_secret}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bsopt-network

  # === Message Broker ===
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bsopt_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bsopt_rmq_secret}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsopt-network

  # === Auth Service ===
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auth-service
      target: development
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://localhost:3001
    volumes:
      - ./src/auth-service:/app
      - /app/node_modules
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsopt-network

  # === API Service ===
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - shared_shm:/dev/shm
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - ML_SERVICE_GRPC_URL=ml-inference:50051
      - USE_SHM=1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsopt-network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --log-level info

  # === Portfolio Service ===
  portfolio:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
    ports:
      - "8003:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL}
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsopt-network
    command: uvicorn src.portfolio.main:app --host 0.0.0.0 --port 8000

  # === [Specialized] ML Inference Manifold ===
  ml-inference:
    profiles: [ "ml" ]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    ports:
      - "5001:5001"
      - "50051:50051"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
      - ML_SERVICE_PORT=5001
      - ML_SERVICE_GRPC_URL=0.0.0.0:50051
    networks:
      - bsopt-network
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    command: python src/ml/serving/serve.py

  # === Worker Service ===
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: development
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - shared_shm:/dev/shm
    ports:
      - "50052:50051" # Changed to avoid collision if run on host
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-bsopt_admin}:${RABBITMQ_PASSWORD:-bsopt_rmq_secret}@rabbitmq:5672//
      - ML_SERVICE_GRPC_URL=ml-inference:50051
      - JWT_SECRET=${JWT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - USE_SHM=1
    healthcheck:
      test: [ "CMD-SHELL", "celery -A src.ml.celery_app inspect ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bsopt-network
    command: celery -A src.ml.celery_app worker -l info

  # === Scraper Service ===
  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper
      target: development
    ports:
      - "8002:8000"
    volumes:
      - ./src:/app/src
      - shared_shm:/dev/shm
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - USE_SHM=1
    healthcheck:
      test: [ "CMD-SHELL", "[ -f /tmp/scraper_heartbeat ] && [ $(($(date +%s) - $(date +%s -r /tmp/scraper_heartbeat))) -lt 600 ] || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsopt-network

  # === Neural Pricing Service ===
  neural-pricing:
    build:
      context: .
      dockerfile: docker/Dockerfile.neural-pricing
      target: development
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src
      - shared_shm:/dev/shm
    deploy:
      resources:
        limits:
          cpus: '4'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - JWT_SECRET=${JWT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - USE_SHM=1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsopt-network
    command: uvicorn src.pricing.main:app --host 0.0.0.0 --port 8000

  # === App Gateway (Node.js Federation) ===
  app-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.app-gateway
      target: development
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - ./src/gateway:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - LOG_LEVEL=debug
      - API_URL=http://api:8000/graphql
      - PORTFOLIO_URL=http://portfolio:8000/graphql
      - PRICING_URL=http://neural-pricing:8000/graphql
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      portfolio:
        condition: service_healthy
      neural-pricing:
        condition: service_healthy
    networks:
      - bsopt-network

  # === Frontend Service ===
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:5173/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      app-gateway:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - bsopt-network

  # === [Specialized] Test Runner ===
  test-runner:
    profiles: [ "test", "benchmark" ]
    build:
      context: .
      dockerfile: docker/Dockerfile.ci
    environment:
      - ENVIRONMENT=test
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/bsopt_test
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/1
      - JWT_SECRET=test_secret_key_change_me_in_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsopt-network
    volumes:
      - .:/app

  # === [Specialized] Blockchain Service ===
  geth:
    profiles: [ "blockchain" ]
    image: ethereum/client-go:stable
    ports:
      - "8545:8545"
      - "8546:8546"
    networks:
      - bsopt-network

  blockchain-worker:
    profiles: [ "blockchain" ]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: development
    environment:
      - BLOCKCHAIN_RPC_URL=http://geth:8545
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - DEFI_CONTRACTS=${DEFI_CONTRACTS:-}
    depends_on:
      - geth
      - redis
    networks:
      - bsopt-network
    command: python src/blockchain/worker.py

  # === [Specialized] Streaming Service ===
  kafka-1:
    profiles: [ "streaming" ]
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-1:9092,CONTROLLER://kafka-1:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bsopt-network

  # === [Specialized] ML Compute Cluster ===
  ray-head:
    profiles: [ "ml" ]
    image: rayproject/ray:latest-py312-cpu
    ports:
      - "8265:8265" # Dashboard
      - "10001:10001" # Ray Client
    networks:
      - bsopt-network
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
    volumes:
      - ./:/app
    shm_size: '8gb'
    deploy:
      resources:
        limits:
          cpus: '2'
    working_dir: /app
    command: ray start --head --port=6379 --dashboard-host=0.0.0.0 --include-dashboard=true --block

  rl-training-worker:
    profiles: [ "ml" ]
    image: rayproject/ray:latest-py312-cpu
    depends_on:
      - ray-head
    environment:
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=${DATABASE_URL}
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - INSIDE_DOCKER=1
      - PGBOUNCER_ENABLED=${PGBOUNCER_ENABLED:-False}
    networks:
      - bsopt-network
    volumes:
      - ./:/app
    shm_size: '8gb'
    deploy:
      resources:
        limits:
          cpus: '4'
    working_dir: /app
    command: ray start --address=ray-head:6379 --block

  # === [Specialized] MLOps Tracking Server ===
  mlflow:
    profiles: [ "ml" ]
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=${DATABASE_URL}
      - MLFLOW_ARTIFACT_ROOT=/app/mlruns
    volumes:
      - ./mlruns:/app/mlruns
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsopt-network
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri ${DATABASE_URL} --default-artifact-root /app/mlruns

  # === [Specialized] MLOps Pipeline Worker ===
  mlops-worker:
    profiles: [ "ml" ]
    build:
      context: .
      dockerfile: docker/Dockerfile.mlops
    depends_on:
      - mlflow
      - ray-head
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - RAY_ADDRESS=ray-head:6379
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@redis:6379/0
      - INSIDE_DOCKER=1
    networks:
      - bsopt-network
    volumes:
      - ./:/app
      - ./mlruns:/app/mlruns

  # === [Specialized] HFT Manifold Launcher ===
  manifold:
    profiles: [ "hft" ]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: production
    network_mode: host
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      memlock: -1
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - DATABASE_URL=${DATABASE_URL_LOCAL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-bsopt_redis_secret}@localhost:6379/0
    command: python scripts/hft/bs_hft_launch.py

  # === [Specialized] Reverse Proxy / Gateway ===
  gateway:
    profiles: [ "proxy" ]
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app-gateway
      - auth-service
    networks:
      - bsopt-network

  # === [Specialized] Observability Stack ===
  # === Monitoring Service ===
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/bsopt?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bsopt-network
    profiles:
      - observability

  prometheus:
    profiles: [ "observability" ]
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - bsopt-network

  grafana:
    profiles: [ "observability" ]
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - bsopt-network

  frontend-test:
    profiles: [ "test" ]
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: development
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    networks:
      - bsopt-network
    command: npm run test -- --run

  e2e-test:
    profiles: [ "test" ]
    image: mcr.microsoft.com/playwright:v1.50.1-jammy
    working_dir: /app/src/frontend
    volumes:
      - .:/app
    environment:
      - PLAYWRIGHT_TEST_BASE_URL=http://frontend:5173
    networks:
      - bsopt-network
    depends_on:
      - frontend
      - auth-service
      - api
    command: npx playwright test

networks:
  bsopt-network:
    driver: bridge

volumes:
  shared_shm:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=2048m"
  postgres_data:
  redis_data:
