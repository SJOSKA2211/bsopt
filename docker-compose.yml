version: "3.9"

services:
  # --- INFRASTRUCTURE LAYER ---
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: bsopt_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB not set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bsopt_cache
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD not set}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:alpine
    container_name: bsopt_broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER not set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD not set}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    container_name: bsopt_vault
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_ADDR=http://0.0.0.0:8200
    networks:
      - app-network
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 2s
      retries: 5

  # --- CORE SERVICES LAYER ---
  auth_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bsopt_auth_api
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY not set}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY not set}
      - GRPC_SECURE=true
      - GRPC_CA_CERT=/etc/pki/root_ca.crt
      - GRPC_SERVER_CERT=/etc/pki/auth-service.crt
      - GRPC_SERVER_KEY=/etc/pki/auth-service.key
    volumes:
      - ./.pki:/etc/pki:ro
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    command: ["python", "api/auth_index.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  pricing_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bsopt_pricing_api
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AUTH_SERVICE_GRPC_URL=auth_api:50051
      - GRPC_SECURE=true
      - GRPC_CA_CERT=/etc/pki/root_ca.crt
      - GRPC_CLIENT_CERT=/etc/pki/api-client.crt
      - GRPC_CLIENT_KEY=/etc/pki/api-client.key
    volumes:
      - ./.pki:/etc/pki:ro
    networks:
      - app-network
    depends_on:
      auth_api:
        condition: service_healthy
    command: ["uvicorn", "api.index:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "uvloop", "--no-access-log"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- WORKER & COMPUTE LAYER ---
  math_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bsopt_math_worker
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      pricing_api:
        condition: service_healthy
    command: ["celery", "-A", "src.workers.math_worker.app", "worker", "--loglevel=info", "-P", "solo"]

  # --- FRONTEND & GATEWAY ---
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: bsopt_frontend_ui
    networks:
      - app-network
    depends_on:
      pricing_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: bsopt_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      frontend:
        condition: service_healthy
      pricing_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
