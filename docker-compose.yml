version: "3.9"

services:
  # --- Infrastructure Layer ---
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manifold}
      POSTGRES_USER: ${POSTGRES_USER:-manifold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manifold}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running", "-q"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    container_name: vault_secrets
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_ADDR=http://0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - app-network
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 2s
      retries: 5

  # --- Application Layer ---
  auth_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_api_server
    environment:
      - GRPC_SECURE=false
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: ["python", "src/auth/auth_server.py"]

  pricing_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricing_engine_api
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "src.math_kernel.main:app", "--host", "0.0.0.0", "--port", "8000"]

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=pyamqp://guest@rabbitmq//
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_healthy
    command: ["celery", "-A", "src.workers.tasks.celery_app", "worker", "--loglevel=info"]

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: bsopt_frontend
    networks:
      - app-network
    depends_on:
      - auth_api
      - pricing_api

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - auth_api
      - pricing_api

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    networks:
      - app-network
    volumes:
      - mlflow_data:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000

volumes:
  postgres_data:
  redis_data:
  mlflow_data:

networks:
  app-network:
    driver: bridge
